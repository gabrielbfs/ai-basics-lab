<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" aria-label="Illustration of the Skills page under Customize. 1: the plus button opens Create skill, with Upload a skill highlighted. 2: the build-spec-writer skill in the list, with its toggle switched on.">
  <!-- Customize > Skills page, drawn for AI Basics Lab. Not a screenshot; the real page may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;fill:#2f2f2c}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#6b6a64}
    .m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13px;font-weight:700;fill:#1f2328}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="640" height="268" fill="#faf9f5"/>
  <!-- left: Customize menu -->
  <text x="16" y="38" class="t" style="font-size:16px;font-weight:700">Customize</text>
  <rect x="12" y="56" width="138" height="28" rx="7" fill="#eceae3"/>
  <text x="24" y="75" class="t" style="font-weight:600">Skills</text>
  <text x="24" y="107" class="t">Connectors</text>
  <!-- main panel -->
  <rect x="166" y="16" width="458" height="238" rx="12" fill="#ffffff" stroke="#dcd9d0"/>
  <text x="184" y="46" class="t" style="font-size:15px;font-weight:700">Skills</text>
  <rect x="578" y="28" width="30" height="26" rx="6" fill="#ffffff" stroke="#c9c9cc"/>
  <text x="593" y="46" text-anchor="middle" class="t" style="font-size:16px">+</text>
  <rect x="573" y="23" width="40" height="36" rx="9" fill="none" stroke="#A31F34" stroke-width="2.5"/>
  <!-- menu -->
  <rect x="420" y="64" width="190" height="72" rx="9" fill="#ffffff" stroke="#c9c9cc"/>
  <text x="434" y="84" class="s">Create skill</text>
  <rect x="428" y="92" width="174" height="26" rx="6" fill="#f8e9ec" stroke="#A31F34" stroke-width="1.5"/>
  <text x="440" y="110" class="t" style="font-weight:600">Upload a skill</text>
  <!-- skill list -->
  <path d="M166 146h458" stroke="#eceae3"/>
  <text x="184" y="170" class="m">build-spec-writer</text>
  <text x="184" y="190" class="s">Turns a prototype or tool idea into a one-page build spec…</text>
  <rect x="566" y="162" width="36" height="20" rx="10" fill="#1f2328"/>
  <circle cx="592" cy="172" r="7" fill="#ffffff"/>
  <rect x="560" y="156" width="48" height="32" rx="12" fill="none" stroke="#A31F34" stroke-width="2.5"/>
  <path d="M166 204h458" stroke="#eceae3"/>
  <rect x="184" y="216" width="120" height="10" rx="5" fill="#eceae3"/>
  <rect x="184" y="232" width="200" height="9" rx="4" fill="#f2f1ec"/>
  <!-- labels -->
  <rect x="184" y="88" width="226" height="24" rx="5" fill="#A31F34"/>
  <text x="297" y="104.5" text-anchor="middle" class="lab">1 · + → Create skill → Upload →</text>
  <path d="M584 190v20" stroke="#A31F34" stroke-width="2"/>
  <rect x="470" y="210" width="134" height="24" rx="5" fill="#A31F34"/>
  <text x="537" y="226.5" text-anchor="middle" class="lab">2 · Check it's on</text>
</svg>
