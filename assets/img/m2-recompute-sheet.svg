<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Illustration of a spreadsheet filtered to Groceries in Q2, with the amount cells selected and the status bar showing Count 15 and Sum $1,629.72 highlighted">
  <!-- Spreadsheet illustration, drawn for AI Basics Lab. Not a screenshot. Example values are Groceries in Q2
       from the practice file (not the Dining out Q3 answer students compute themselves). -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .h{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#1f2328}
    .m{fill:#5f6368}
    .g{stroke:#dadce0;stroke-width:1}
  </style>
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- header row -->
  <rect x="10" y="10" width="620" height="30" fill="#f1f3f4"/>
  <text class="h" x="20"  y="30">date</text>
  <text class="h" x="120" y="30">quarter</text>
  <text class="h" x="220" y="30">merchant</text>
  <text class="h" x="390" y="30">category</text>
  <text class="h" x="520" y="30">amount_usd</text>
  <!-- active filter buttons (funnel) on quarter and category -->
  <g fill="#1a73e8">
    <rect x="182" y="17" width="18" height="16" rx="3" fill="#e8f0fe" stroke="#1a73e8"/>
    <path d="M186 21h10l-4 4.5v4l-2 1v-5z"/>
    <rect x="482" y="17" width="18" height="16" rx="3" fill="#e8f0fe" stroke="#1a73e8"/>
    <path d="M486 21h10l-4 4.5v4l-2 1v-5z"/>
  </g>
  <!-- filter labels -->
  <rect x="120" y="44" width="90" height="20" rx="4" fill="#e8f0fe"/>
  <text x="128" y="58" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a73e8">quarter = Q2</text>
  <rect x="390" y="44" width="122" height="20" rx="4" fill="#e8f0fe"/>
  <text x="398" y="58" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a73e8">category = Groceries</text>
  <!-- rows -->
  <g class="t">
    <text x="20" y="90">2025-04-03</text><text x="120" y="90">Q2</text><text x="220" y="90">Corner Market</text><text x="390" y="90">Groceries</text>
    <text x="20" y="116">2025-04-05</text><text x="120" y="116">Q2</text><text x="220" y="116">Green Basket Market</text><text x="390" y="116">Groceries</text>
    <text x="20" y="142">2025-04-07</text><text x="120" y="142">Q2</text><text x="220" y="142">Corner Market</text><text x="390" y="142">Groceries</text>
    <text x="20" y="168">2025-04-14</text><text x="120" y="168">Q2</text><text x="220" y="168">FreshCo Grocery</text><text x="390" y="168">Groceries</text>
    <text x="20" y="194">2025-04-21</text><text x="120" y="194">Q2</text><text x="220" y="194">Corner Market</text><text x="390" y="194">Groceries</text>
  </g>
  <text class="t m" x="20" y="220">… 10 more rows</text>
  <!-- selected amount cells -->
  <rect x="512" y="72" width="118" height="156" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <g class="t">
    <text x="610" y="90"  text-anchor="end">$127.72</text>
    <text x="610" y="116" text-anchor="end">$58.21</text>
    <text x="610" y="142" text-anchor="end">$58.68</text>
    <text x="610" y="168" text-anchor="end">$109.19</text>
    <text x="610" y="194" text-anchor="end">$120.85</text>
    <text x="610" y="220" text-anchor="end" class="m">…</text>
  </g>
  <g class="g"><path d="M10 72h620M10 98h620M10 124h620M10 150h620M10 176h620M10 202h620M10 228h620"/></g>
  <!-- status bar -->
  <rect x="10" y="252" width="620" height="34" fill="#f1f3f4"/>
  <text class="t m" x="300" y="274">Average: $108.65</text>
  <text class="t" x="430" y="274" style="font-weight:600">Count: 15</text>
  <text class="t" x="510" y="274" style="font-weight:600">Sum: $1,629.72</text>
  <rect x="422" y="256" width="204" height="26" rx="6" fill="none" stroke="#A31F34" stroke-width="3"/>
  <rect x="20" y="258" width="196" height="22" rx="5" fill="#A31F34"/>
  <text x="118" y="273.5" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff">Select the amounts, read here →</text>
</svg>
