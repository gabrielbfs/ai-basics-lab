<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 156" width="790" height="156" role="img" aria-label="Diagram: from your folder to a live link. 1, Commit: save a version, on your computer. 2, Push: send your commits to GitHub. 3, GitHub repo: your versions, online. 4, Live link: GitHub Pages turns the repo into a site, highlighted. An arrow loops back from the live link to commit: change something, commit and push, and the site updates.">
  <!-- Module 8 key-ideas drawing, made for AI Basics Lab. Same style as m7-build-loop.svg. -->
  <style>
    .b{fill:#ffffff;stroke:#d9d6cf;stroke-width:1.5}
    .k{fill:#f8e9ec;stroke:#A31F34;stroke-width:1.5}
    .n{font-family:"Jost",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;font-weight:700;fill:#A31F34}
    .t{font-family:"Jost",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;font-weight:600;fill:#1f2328}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;fill:#5f6368}
    .l{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.08em;fill:#5f6368}
    .a{fill:none;stroke:#8a8f98;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text class="l" x="10" y="12">ON YOUR COMPUTER</text>
  <text class="l" x="418" y="12">ONLINE</text>
  <rect class="b" x="10"  y="18" width="172" height="84" rx="10"/>
  <rect class="b" x="214" y="18" width="172" height="84" rx="10"/>
  <rect class="b" x="418" y="18" width="172" height="84" rx="10"/>
  <rect class="k" x="622" y="18" width="158" height="84" rx="10"/>
  <text class="n" x="24"  y="40">1</text><text class="t" x="24"  y="62">Commit</text>
  <text class="s" x="24"  y="80">Save a version,</text><text class="s" x="24" y="95">with a short message</text>
  <text class="n" x="228" y="40">2</text><text class="t" x="228" y="62">Push</text>
  <text class="s" x="228" y="80">Send your commits</text><text class="s" x="228" y="95">to GitHub</text>
  <text class="n" x="432" y="40">3</text><text class="t" x="432" y="62">GitHub repo</text>
  <text class="s" x="432" y="80">Every version,</text><text class="s" x="432" y="95">kept online</text>
  <text class="n" x="636" y="40">4</text><text class="t" x="636" y="62">Live link</text>
  <text class="s" x="636" y="80">GitHub Pages turns</text><text class="s" x="636" y="95">it into a site</text>
  <path class="a" d="M186 60h24M204 54l6 6-6 6"/>
  <path class="a" d="M390 60h24M408 54l6 6-6 6"/>
  <path class="a" d="M594 60h24M612 54l6 6-6 6"/>
  <path class="a" d="M701 106v26H96v-24M90 114l6-6 6 6"/>
  <text class="s" x="398" y="150" text-anchor="middle">Change something, commit and push: the site updates</text>
</svg>
