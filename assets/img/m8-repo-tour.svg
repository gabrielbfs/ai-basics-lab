  <circle cx="870" cy="166" r="11" fill="#A31F34"/><text class="num" x="870" y="170.5" text-anchor="middle">6</text>
  <path class="ln" d="M656 214h222"/>
  <text class="t" x="662" y="238" style="font-weight:700">Deployments</text>
  <text class="s" x="662" y="260">github-pages · 2 minutes ago</text>
