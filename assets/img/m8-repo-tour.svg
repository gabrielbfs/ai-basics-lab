<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Illustration of a repository page on GitHub, with six numbered parts. 1, the repository name your-username / trail-club-calculator and a Public badge. 2, the commits count, 4 commits. 3, the file list, with index.html at the top level highlighted. 4, the README under the files, showing the live link. 5, the Settings tab. 6, the About box on the right, with the live site link.">
  <!-- A GitHub repository page, drawn for AI Basics Lab. Not a screenshot; the real page may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;fill:#1f2328}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;fill:#59636e}
    .m{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#1f2328}
    .lk{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;fill:#0969da}
    .num{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;font-weight:700;fill:#ffffff}
    .ln{stroke:#d1d9e0}
  </style>
  <rect width="900" height="420" fill="#f6f8fa"/>
  <rect x="10" y="10" width="880" height="400" rx="10" fill="#ffffff" stroke="#d1d9e0"/>

  <!-- header -->
