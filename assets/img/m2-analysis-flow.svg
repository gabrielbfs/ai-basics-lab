<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 104" width="790" height="104" role="img" aria-label="Diagram: 1 Sources, check them yourself; then 2 Method, before the math; then 3 Chart, fits the question; then 4 Recompute, one number yourself.">
  <!-- Module 2 flow diagram, drawn for AI Basics Lab. Same style as m1-prompt-loop.svg. -->
  <style>
    .b{fill:#ffffff;stroke:#d9d6cf;stroke-width:1.5}
    .k{fill:#f8e9ec;stroke:#A31F34;stroke-width:1.5}
    .n{font-family:"Jost",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;font-weight:700;fill:#A31F34}
    .t{font-family:"Jost",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;font-weight:600;fill:#1f2328}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;fill:#5f6368}
    .a{fill:none;stroke:#8a8f98;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect class="b" x="10"  y="14" width="168" height="76" rx="10"/>
  <rect class="b" x="214" y="14" width="168" height="76" rx="10"/>
  <rect class="b" x="418" y="14" width="168" height="76" rx="10"/>
  <rect class="k" x="622" y="14" width="158" height="76" rx="10"/>
  <text class="n" x="24"  y="36">1</text><text class="t" x="24"  y="58">Sources</text><text class="s" x="24"  y="78">check them yourself</text>
  <text class="n" x="228" y="36">2</text><text class="t" x="228" y="58">Method</text><text class="s" x="228" y="78">before the math</text>
  <text class="n" x="432" y="36">3</text><text class="t" x="432" y="58">Chart</text><text class="s" x="432" y="78">fits the question</text>
  <text class="n" x="636" y="36">4</text><text class="t" x="636" y="58">Recompute</text><text class="s" x="636" y="78">one number yourself</text>
  <path class="a" d="M182 52h28M204 46l6 6-6 6"/>
  <path class="a" d="M386 52h28M408 46l6 6-6 6"/>
  <path class="a" d="M590 52h28M612 46l6 6-6 6"/>
</svg>
