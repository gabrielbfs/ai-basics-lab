<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-label="Illustration of a chat: Claude makes an unsourced claim, you push back with a specific question, and Claude corrects itself">
  <!-- Pushback example, drawn for AI Basics Lab. Not a screenshot. Made-up conversation. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;fill:#2f2f2c}
    .tag{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:10.5px;letter-spacing:.08em;font-weight:600}
  </style>
  <rect width="620" height="330" fill="#ffffff"/>

  <!-- 1. Claude's claim -->
  <text x="20" y="26" class="tag" fill="#5f6368">CLAUDE'S CLAIM</text>
  <circle cx="30" cy="54" r="9" fill="#d97757"/>
  <rect x="48" y="36" width="400" height="58" rx="12" fill="#ffffff" stroke="#e3e1da"/>
  <text x="64" y="60" class="t">Expert version: after a price war, margins</text>
  <text x="64" y="80" class="t">typically fall 20–30%.</text>
  <rect x="368" y="70" width="64" height="16" rx="3" fill="#fff4cc"/>
  <text x="400" y="82" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:10.5px;font-weight:700;fill:#7A5A00">no source</text>

  <!-- 2. Your pushback -->
  <text x="600" y="124" text-anchor="end" class="tag" fill="#A31F34">YOUR PUSHBACK</text>
  <rect x="170" y="134" width="430" height="58" rx="12" fill="#f8e9ec" stroke="#A31F34" stroke-width="1.5"/>
  <text x="186" y="158" class="t">Typical for which industry? Give me a source I can</text>
  <text x="186" y="178" class="t">open, or say you're estimating.</text>

  <!-- 3. Claude's fix -->
  <text x="20" y="222" class="tag" fill="#2E6B2A">CLAUDE'S FIX</text>
  <circle cx="30" cy="250" r="9" fill="#d97757"/>
  <rect x="48" y="232" width="430" height="78" rx="12" fill="#ffffff" stroke="#e3e1da"/>
  <text x="64" y="256" class="t">You're right to ask: 20–30% is my estimate, not a</text>
  <text x="64" y="276" class="t">sourced figure. Here's the expert version without it,</text>
  <text x="64" y="296" class="t">focused on what drives the drop instead.</text>
</svg>
