  <text x="366" y="199" class="s" style="fill:#2f2f2c">inputs.xlsx</text>
  <rect x="356" y="214" width="248" height="26" rx="6" fill="#f6f5f1" stroke="#e3e1da"/>
  <text x="366" y="231" class="s" style="fill:#2f2f2c">brief.docx</text>
  <rect x="350" y="146" width="260" height="102" rx="9" fill="none" stroke="#A31F34" stroke-width="2.5"/>
  <!-- labels -->
