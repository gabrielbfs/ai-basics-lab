<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="Illustration of a Claude project page called Savings planner. On the right, 1: the Instructions box, where you paste your instructions. 2: the Files area with an Add button, holding inputs.xlsx and brief.docx.">
