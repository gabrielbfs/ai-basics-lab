<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" role="img" aria-label="Illustration of the Create scheduled task form: a name (Morning digest), the prompt, a frequency menu set to Weekdays, an approval setting set to ask before any action, and Cancel and Save buttons. Labels: 1, how often. 2, keep it asking you first.">
  <!-- Create scheduled task form, drawn for AI Basics Lab. Not a screenshot; the real form may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;fill:#2f2f2c}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#6b6a64}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
    .in{fill:#ffffff;stroke:#c9c9cc}
    .r{fill:none;stroke:#A31F34;stroke-width:2.5}
    .a{fill:none;stroke:#A31F34;stroke-width:2}
  </style>
  <rect width="640" height="336" fill="#faf9f5"/>
  <rect x="16" y="14" width="424" height="308" rx="12" fill="#ffffff" stroke="#dcd9d0"/>
  <text x="32" y="44" class="t" style="font-size:15px;font-weight:700">Create scheduled task</text>

  <text x="32" y="66" class="s">Name</text>
  <rect class="in" x="32" y="72" width="392" height="26" rx="6"/>
  <text x="42" y="89.5" class="t">Morning digest</text>

  <text x="32" y="118" class="s">Prompt</text>
  <rect class="in" x="32" y="124" width="392" height="44" rx="6"/>
  <text x="42" y="141" class="t">Using work-week/: list today's meetings and the emails</text>
  <text x="42" y="159" class="t">that need a reply, under 10 lines. Read only…</text>

  <text x="32" y="188" class="s">Frequency</text>
  <rect class="in" x="32" y="194" width="220" height="26" rx="6"/>
  <text x="42" y="211.5" class="t">Weekdays</text><text x="238" y="211.5" class="s" text-anchor="end">▾</text>
  <rect class="r" x="27" y="189" width="230" height="36" rx="8"/>

  <text x="32" y="240" class="s">Approval</text>
  <rect class="in" x="32" y="246" width="220" height="26" rx="6"/>
  <text x="42" y="263.5" class="t">Ask me before any action</text><text x="238" y="263.5" class="s" text-anchor="end">▾</text>
  <rect class="r" x="27" y="241" width="230" height="36" rx="8"/>

  <rect class="in" x="296" y="288" width="60" height="24" rx="6"/><text x="326" y="304.5" class="t" text-anchor="middle">Cancel</text>
  <rect x="364" y="288" width="60" height="24" rx="6" fill="#1f2328"/><text x="394" y="304.5" class="t" text-anchor="middle" style="fill:#ffffff">Save</text>

  <path class="a" d="M259 207H456"/>
  <rect x="456" y="195" width="168" height="24" rx="5" fill="#A31F34"/>
  <text x="540" y="211.5" text-anchor="middle" class="lab">1 · How often</text>
  <path class="a" d="M259 259H456"/>
  <rect x="456" y="247" width="168" height="24" rx="5" fill="#A31F34"/>
  <text x="540" y="263.5" text-anchor="middle" class="lab">2 · Keep it asking you first</text>
</svg>
