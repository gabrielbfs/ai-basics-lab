<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Illustration of a permission request: Claude wants to create inputs.xlsx in ai-basics, with Deny and Allow buttons. Labels point to what to read: the action (create), the file (inputs.xlsx) and the folder (ai-basics).">
  <!-- Permission request, drawn for AI Basics Lab. Not a screenshot; the real dialog may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;fill:#2f2f2c}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="640" height="200" fill="#faf9f5"/>
  <rect x="16" y="16" width="400" height="168" rx="12" fill="#ffffff" stroke="#dcd9d0"/>
  <text x="36" y="48" class="t" style="font-weight:700">Claude wants to make a change</text>
  <text x="36" y="80" class="t">Create</text>
  <text x="90" y="80" class="t" style="font-weight:700">inputs.xlsx</text>
  <text x="36" y="104" class="t" style="fill:#6b6a64">in ai-basics</text>
  <rect x="200" y="132" width="90" height="34" rx="8" fill="#ffffff" stroke="#c9c9cc"/>
  <text x="245" y="154" text-anchor="middle" class="t">Deny</text>
  <rect x="302" y="132" width="98" height="34" rx="8" fill="#2f2f2c"/>
  <text x="351" y="154" text-anchor="middle" class="t" style="fill:#ffffff;font-weight:600">Allow</text>
  <!-- what to read -->
  <rect x="31" y="64" width="52" height="24" rx="5" fill="none" stroke="#A31F34" stroke-width="2"/>
  <rect x="86" y="64" width="86" height="24" rx="5" fill="none" stroke="#A31F34" stroke-width="2"/>
  <rect x="31" y="89" width="88" height="22" rx="5" fill="none" stroke="#A31F34" stroke-width="2"/>
  <path d="M176 76h258" stroke="#A31F34" stroke-width="2"/>
  <rect x="436" y="40" width="190" height="24" rx="5" fill="#A31F34"/><text x="531" y="56.5" text-anchor="middle" class="lab">1 · Create, change or delete?</text>
  <rect x="436" y="68" width="190" height="24" rx="5" fill="#A31F34"/><text x="531" y="84.5" text-anchor="middle" class="lab">2 · Which file?</text>
  <path d="M123 100h311" stroke="#A31F34" stroke-width="2"/>
  <rect x="436" y="96" width="190" height="24" rx="5" fill="#A31F34"/><text x="531" y="112.5" text-anchor="middle" class="lab">3 · Inside your folder?</text>
  <text x="531" y="150" text-anchor="middle" class="t" style="font-size:12.5px;fill:#5f6368">All three as expected? Allow.</text>
  <text x="531" y="168" text-anchor="middle" class="t" style="font-size:12.5px;fill:#5f6368">Anything surprising? Deny and ask.</text>
</svg>
