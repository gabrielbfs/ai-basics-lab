<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" role="img" aria-label="Illustration: the macOS pop-up asking to install the command line developer tools, with the Install button highlighted">
  <!-- Illustration of the macOS developer-tools prompt, drawn for AI Basics Lab. Not a screenshot. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#1d1d1f}
  </style>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".18"/></filter>
  </defs>
  <rect width="500" height="230" fill="#e9eaec"/>
  <rect x="20" y="16" width="460" height="192" rx="12" fill="#f6f6f6" stroke="#d2d2d4" filter="url(#sh)"/>
  <!-- app icon -->
  <rect x="40" y="38" width="52" height="52" rx="12" fill="#5a5f66"/>
  <text x="66" y="71" text-anchor="middle" class="t" style="font-size:17px;font-weight:700;fill:#ffffff">&gt;_</text>
  <!-- text -->
  <text x="108" y="50" class="t" style="font-size:13.5px;font-weight:700">The “git” command requires the command line</text>
  <text x="108" y="68" class="t" style="font-size:13.5px;font-weight:700">developer tools. Would you like to install</text>
  <text x="108" y="86" class="t" style="font-size:13.5px;font-weight:700">the tools now?</text>
  <text x="108" y="110" class="t" style="font-size:12px;fill:#4a4a4d">Choose Install to download and install the command</text>
  <text x="108" y="126" class="t" style="font-size:12px;fill:#4a4a4d">line developer tools now.</text>
  <!-- buttons -->
  <rect x="108" y="150" width="88" height="26" rx="6" fill="#ffffff" stroke="#c9c9cc"/>
  <text x="152" y="167.5" text-anchor="middle" class="t" style="font-size:13px">Get Xcode</text>
  <rect x="268" y="150" width="78" height="26" rx="6" fill="#ffffff" stroke="#c9c9cc"/>
  <text x="307" y="167.5" text-anchor="middle" class="t" style="font-size:13px">Not Now</text>
  <rect x="356" y="150" width="78" height="26" rx="6" fill="#0a7cff"/>
  <text x="395" y="167.5" text-anchor="middle" class="t" style="font-size:13px;font-weight:600;fill:#ffffff">Install</text>
  <!-- highlight -->
  <rect x="350" y="144" width="90" height="38" rx="9" fill="none" stroke="#A31F34" stroke-width="3"/>
  <rect x="356" y="190" width="78" height="22" rx="5" fill="#A31F34"/>
  <text x="395" y="205" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff">Click Install</text>
</svg>
