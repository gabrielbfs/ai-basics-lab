<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" width="640" height="212" role="img" aria-label="Illustration of a chat. You ask: Which skills did you use? Claude answers: I used one skill, build-spec-writer. I read the prototype, asked who will read the spec, then wrote spec.md in the skill's format, ending with the checks.">
  <!-- The trigger check, drawn for AI Basics Lab. Not a screenshot. -->
  <style>
