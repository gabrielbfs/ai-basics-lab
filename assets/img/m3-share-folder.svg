<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="Illustration of the Claude desktop app message box with a folder button highlighted, and a folder list where ai-basics is selected while Documents and Desktop are crossed out.">
  <!-- Choosing a folder in the Claude desktop app, drawn for AI Basics Lab. Not a screenshot: this part of the app
       is changing during the Chat + Cowork merge, so the real button may look or be placed differently. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;fill:#2f2f2c}
    .ic{fill:none;stroke:#3d3d3a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="600" height="250" fill="#faf9f5"/>
  <!-- folder list -->
  <rect x="24" y="14" width="250" height="122" rx="10" fill="#ffffff" stroke="#e3e1da"/>
  <text x="40" y="38" class="t" style="font-weight:700">Choose a folder</text>
  <rect x="32" y="48" width="234" height="28" rx="6" fill="#e6f4ea"/>
  <path d="M42 56h9l2 3h12v10H42z" fill="#f2c94c"/>
  <text x="74" y="67" class="t" style="font-weight:700">Documents/ai-basics</text>
  <path d="M246 56l4 4 8-8" fill="none" stroke="#2E6B2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 86h9l2 3h12v10H42z" fill="#e0ded7"/>
  <text x="74" y="97" class="t" style="fill:#9a988f">Documents</text>
  <path d="M74 93h72" stroke="#A31F34" stroke-width="1.6"/>
  <path d="M42 112h9l2 3h12v10H42z" fill="#e0ded7"/>
  <text x="74" y="123" class="t" style="fill:#9a988f">Desktop</text>
  <path d="M74 119h56" stroke="#A31F34" stroke-width="1.6"/>
  <rect x="290" y="50" width="196" height="24" rx="5" fill="#A31F34"/>
  <text x="388" y="66.5" text-anchor="middle" class="lab">2 · Pick ai-basics only</text>
  <!-- message box -->
  <rect x="16" y="150" width="568" height="86" rx="16" fill="#ffffff" stroke="#dcd9d0"/>
  <text x="36" y="180" class="t" style="fill:#9a988f">Describe a task…</text>
  <rect x="30" y="196" width="104" height="30" rx="8" fill="#ffffff" stroke="#dcd9d0"/>
  <path d="M42 205h9l2 3h12v10H42z" class="ic"/>
  <text x="74" y="216" class="t" style="font-size:12.5px">Folder</text>
  <rect x="25" y="191" width="114" height="40" rx="10" fill="none" stroke="#A31F34" stroke-width="3"/>
  <rect x="148" y="199" width="140" height="24" rx="5" fill="#A31F34"/>
  <text x="218" y="215.5" text-anchor="middle" class="lab">1 · Choose a folder</text>
  <rect x="544" y="196" width="30" height="30" rx="8" fill="#d97757"/>
</svg>
