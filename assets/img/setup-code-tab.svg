<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" role="img" aria-label="Illustration: top-left corner of the Claude desktop app, with the Code button highlighted">
  <!-- Illustration of the Claude desktop app (light mode), drawn for AI Basics Lab. Not a screenshot. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;fill:#2f2f2c}
    .ic{fill:none;stroke:#3d3d3a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .dim{stroke:#a8a69f}
  </style>
  <rect width="520" height="210" fill="#ffffff"/>
  <!-- sidebar -->
  <rect width="262" height="210" fill="#f5f4ef"/>
  <line x1="262" y1="0" x2="262" y2="210" stroke="#e3e1da"/>
  <!-- top bar icons -->
  <g class="ic">
    <path d="M16 17h16M16 23h12M16 29h16"/>
    <rect x="44" y="15" width="17" height="16" rx="3"/><path d="M50 15v16"/>
    <path d="M80 17l-6 6 6 6"/>
    <path class="dim" d="M100 17l6 6-6 6"/>
  </g>
  <!-- chat / code switch -->
  <rect x="124" y="8" width="78" height="31" rx="8" fill="#e9e7e0"/>
  <rect x="127" y="11" width="35" height="25" rx="6" fill="#ffffff" stroke="#dcd9d0"/>
  <g class="ic"><path d="M137 17h15a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-9l-4 3v-3h-2a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z"/></g>
  <text x="182" y="28.5" text-anchor="middle" class="t" style="font-size:13px;font-weight:600">&lt;/&gt;</text>
  <!-- highlight -->
  <rect x="163" y="6" width="38" height="35" rx="8" fill="none" stroke="#A31F34" stroke-width="3"/>
  <path d="M206 23h22" stroke="#A31F34" stroke-width="2.5"/>
  <path d="M206 23l7-5M206 23l7 5" stroke="#A31F34" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="230" y="10" width="62" height="26" rx="5" fill="#A31F34"/>
  <text x="261" y="28" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;font-weight:700;fill:#ffffff">Code</text>
  <!-- sidebar items -->
  <rect x="8" y="56" width="246" height="32" rx="8" fill="#e9e7e0"/>
  <g class="ic"><path d="M22 72h12M28 66v12"/></g>
  <text x="44" y="77" class="t" style="font-weight:600">New</text>
  <g class="ic"><circle cx="27" cy="107" r="5.5"/><path d="M31 111l4 4"/></g>
  <text x="44" y="112" class="t">Search</text>
  <g class="ic"><rect x="21" y="136" width="13" height="10" rx="2"/><path d="M23 132h9M22 134h11"/></g>
  <text x="44" y="146" class="t">Projects</text>
  <g class="ic"><rect x="21" y="166" width="10" height="13" rx="2"/><rect x="25" y="170" width="10" height="13" rx="2"/></g>
  <text x="44" y="180" class="t">Artifacts</text>
</svg>
