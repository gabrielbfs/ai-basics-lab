<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" width="680" height="302" role="img" aria-label="Illustration of GitHub's Settings, Pages page. Under Build and deployment: 1, Source set to Deploy from a branch. 2, Branch set to main and / (root), then Save. 3, a minute or two later, a box says Your site is live at your-username.github.io/trail-club-calculator, with a Visit site button.">
  <!-- Settings > Pages, drawn for AI Basics Lab. Not a screenshot; the real page may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#59636e}
    .lk{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#0969da}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
    .sel{fill:#f6f8fa;stroke:#d1d9e0}
    .r{fill:none;stroke:#A31F34;stroke-width:2.5}
    .a{fill:none;stroke:#A31F34;stroke-width:2}
  </style>
  <rect width="680" height="302" fill="#f6f8fa"/>
  <rect x="10" y="10" width="660" height="282" rx="10" fill="#ffffff" stroke="#d1d9e0"/>

  <!-- settings menu -->
  <text class="s" x="26" y="38" style="font-weight:700">Settings</text>
  <text class="t" x="30" y="66">General</text>
  <text class="t" x="30" y="92">Collaborators</text>
  <text class="t" x="30" y="118">Branches</text>
  <rect x="20" y="128" width="126" height="26" rx="6" fill="#eff2f5"/>
  <rect x="20" y="132" width="3" height="18" rx="1.5" fill="#fd8c73"/>
  <text class="t" x="30" y="146" style="font-weight:700">Pages</text>
  <text class="t" x="30" y="174">Security</text>
  <path d="M156 20v262" stroke="#d1d9e0"/>

  <!-- pages -->
  <text class="t" x="176" y="42" style="font-size:18px;font-weight:700">GitHub Pages</text>
  <text class="t" x="176" y="74" style="font-weight:700">Build and deployment</text>
  <text class="s" x="176" y="98">Source</text>
  <rect class="sel" x="176" y="106" width="190" height="28" rx="6"/>
  <text class="t" x="188" y="124.5">Deploy from a branch ▾</text>
  <rect class="r" x="171" y="101" width="200" height="38" rx="9"/>
  <text class="s" x="176" y="160">Branch</text>
  <rect class="sel" x="176" y="168" width="80" height="28" rx="6"/>
  <text class="t" x="188" y="186.5">main ▾</text>
  <rect class="sel" x="262" y="168" width="96" height="28" rx="6"/>
  <text class="t" x="274" y="186.5">/ (root) ▾</text>
  <rect x="364" y="168" width="56" height="28" rx="6" fill="#1f883d"/>
  <text class="t" x="392" y="186.5" text-anchor="middle" style="fill:#ffffff;font-weight:600">Save</text>
  <rect class="r" x="171" y="163" width="254" height="38" rx="9"/>

  <text class="s" x="176" y="226">A minute or two later:</text>
  <rect x="176" y="234" width="290" height="50" rx="6" fill="#dafbe1" stroke="#aceebb"/>
  <text class="t" x="188" y="254" style="font-weight:600">Your site is live at</text>
  <text class="lk" x="188" y="272">your-username.github.io/trail-club-…</text>
  <rect x="392" y="246" width="66" height="24" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
  <text class="s" x="425" y="262" text-anchor="middle" style="fill:#1f2328">Visit site</text>
  <rect class="r" x="171" y="229" width="300" height="60" rx="9"/>

  <!-- labels -->
  <path class="a" d="M373 120H486"/>
  <rect x="486" y="108" width="176" height="24" rx="5" fill="#A31F34"/>
  <text x="574" y="124.5" text-anchor="middle" class="lab">1 · Deploy from a branch</text>
  <path class="a" d="M427 182H486"/>
  <rect x="486" y="170" width="176" height="24" rx="5" fill="#A31F34"/>
  <text x="574" y="186.5" text-anchor="middle" class="lab">2 · main, / (root), Save</text>
  <path class="a" d="M473 259H486"/>
  <rect x="486" y="247" width="176" height="24" rx="5" fill="#A31F34"/>
  <text x="574" y="263.5" text-anchor="middle" class="lab">3 · Your live link</text>
</svg>
