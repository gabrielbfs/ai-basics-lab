<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" width="640" height="244" role="img" aria-label="Illustration of the row under the prompt box in the Code tab. 1, the first control, the environment selector, set to Local. 2, next to it, the folder control is open, with Open folder… highlighted; choose ai-basics-app. Further right are the mode and model controls.">
  <!-- The row under the prompt box, drawn for AI Basics Lab. Not a screenshot; the real controls may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;fill:#2f2f2c}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#6b6a64}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
    .pill{fill:#f2f1ec;stroke:#d9d6cf}
    .r{fill:none;stroke:#A31F34;stroke-width:2.5}
    .a{fill:none;stroke:#A31F34;stroke-width:2}
  </style>
  <rect width="640" height="244" fill="#faf9f5"/>
  <rect x="16" y="14" width="608" height="170" rx="14" fill="#ffffff" stroke="#c9c9cc"/>
  <text class="s" x="32" y="44">Describe what you want Claude to do…</text>
  <path d="M16 62h608" stroke="#eceae3"/>

  <!-- the row -->
  <rect class="pill" x="28" y="74" width="96" height="26" rx="13"/>
  <text class="t" x="76" y="91.5" text-anchor="middle" style="font-weight:600">Local ▾</text>
  <rect class="r" x="23" y="69" width="106" height="36" rx="17"/>
  <rect class="pill" x="138" y="74" width="150" height="26" rx="13"/>
  <text class="t" x="213" y="91.5" text-anchor="middle">Choose folder ▾</text>
  <rect class="pill" x="470" y="74" width="66" height="26" rx="13"/>
  <text class="s" x="503" y="91.5" text-anchor="middle">Plan ▾</text>
  <rect class="pill" x="544" y="74" width="68" height="26" rx="13"/>
  <text class="s" x="578" y="91.5" text-anchor="middle">Model ▾</text>

  <!-- folder menu -->
  <rect x="138" y="106" width="200" height="72" rx="9" fill="#ffffff" stroke="#c9c9cc"/>
  <text class="s" x="152" y="126">Recent folders</text>
  <rect x="144" y="136" width="188" height="28" rx="6" fill="#f8e9ec" stroke="#A31F34" stroke-width="1.5"/>
  <text class="t" x="156" y="155" style="font-weight:700">Open folder…</text>

  <!-- labels -->
  <path class="a" d="M76 105v95"/>
  <rect x="16" y="200" width="200" height="26" rx="5" fill="#A31F34"/>
  <text x="116" y="217.5" text-anchor="middle" class="lab">1 · Environment: Local</text>
  <path class="a" d="M332 150H362"/>
  <rect x="362" y="137" width="250" height="26" rx="5" fill="#A31F34"/>
  <text x="487" y="154.5" text-anchor="middle" class="lab">2 · Open folder… → ai-basics-app</text>
</svg>
