<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" role="img" aria-label="Illustration of an approval request in a chat. Claude wants to use Gmail to send an email to cfo@ridgeway.example with the subject Re: price test kickoff, with Deny and Allow buttons. Labels: 1, what it will do. 2, to whom. 3, not what you asked for? Deny.">
  <!-- An approval request, drawn for AI Basics Lab. Not a screenshot; the real request may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;fill:#2f2f2c}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#6b6a64}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
    .r{fill:none;stroke:#A31F34;stroke-width:2.5}
    .a{fill:none;stroke:#A31F34;stroke-width:2}
  </style>
  <rect width="640" height="256" fill="#ffffff"/>
  <text x="16" y="30" class="s" style="font-weight:700">Claude</text>
  <text x="16" y="52" class="t">I've drafted the reply to the CFO. Want me to send it?</text>

  <rect x="16" y="70" width="400" height="170" rx="12" fill="#faf9f5" stroke="#dcd9d0"/>
  <text x="32" y="98" class="t" style="font-weight:700">Claude wants to use Gmail: Send email</text>
  <rect class="r" x="24" y="80" width="300" height="28" rx="7"/>
  <text x="32" y="132" class="t">To: cfo@ridgeway.example</text>
  <rect class="r" x="24" y="114" width="210" height="28" rx="7"/>
  <text x="32" y="160" class="s">Subject: Re: price test kickoff</text>
  <text x="32" y="180" class="s">"Thanks, the Monday 2pm kickoff works for me…"</text>
  <rect x="244" y="198" width="74" height="28" rx="7" fill="#1f2328"/>
  <text x="281" y="217" text-anchor="middle" class="t" style="fill:#ffffff">Allow</text>
  <rect x="330" y="198" width="70" height="28" rx="7" fill="#ffffff" stroke="#c9c9cc"/>
  <text x="365" y="217" text-anchor="middle" class="t">Deny</text>
  <rect class="r" x="325" y="193" width="80" height="38" rx="9"/>

  <path class="a" d="M326 94H436"/>
  <rect x="436" y="82" width="188" height="24" rx="5" fill="#A31F34"/>
  <text x="530" y="98.5" text-anchor="middle" class="lab">1 · What it will do</text>
  <path class="a" d="M236 128H436"/>
  <rect x="436" y="116" width="188" height="24" rx="5" fill="#A31F34"/>
  <text x="530" y="132.5" text-anchor="middle" class="lab">2 · To whom</text>
  <path class="a" d="M405 212H436"/>
  <rect x="436" y="200" width="188" height="24" rx="5" fill="#A31F34"/>
  <text x="530" y="216.5" text-anchor="middle" class="lab">3 · Not what you asked? Deny</text>
</svg>
