<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="620" height="240" role="img" aria-label="Illustration of a Share dialog for an artifact: Your organization is selected, People you invite is allowed, and Anyone with the link (public) is crossed out.">
  <!-- Share dialog, drawn for AI Basics Lab. Not a screenshot: the real dialog depends on your plan and may look different. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;fill:#2f2f2c}
    .s{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:#6b6a64}
    .lab{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="620" height="240" fill="#faf9f5"/>
  <rect x="16" y="14" width="370" height="212" rx="12" fill="#ffffff" stroke="#dcd9d0"/>
  <text x="34" y="44" class="t" style="font-weight:700">Share "Savings goal planner"</text>
  <text x="34" y="66" class="s">Who can open this artifact?</text>

  <!-- option 1: organization (selected) -->
  <rect x="28" y="80" width="346" height="40" rx="8" fill="#e6f4ea" stroke="#2E6B2A" stroke-width="1.5"/>
  <circle cx="48" cy="100" r="7" fill="none" stroke="#2E6B2A" stroke-width="1.8"/><circle cx="48" cy="100" r="3.5" fill="#2E6B2A"/>
  <text x="64" y="98" class="t" style="font-weight:600">Your organization</text>
  <text x="64" y="113" class="s">Anyone signed in to your Enterprise account</text>

  <!-- option 2: people by name -->
  <rect x="28" y="128" width="346" height="40" rx="8" fill="#ffffff" stroke="#e3e1da"/>
  <circle cx="48" cy="148" r="7" fill="none" stroke="#9a988f" stroke-width="1.8"/>
  <text x="64" y="146" class="t">People you invite</text>
  <text x="64" y="161" class="s">Only the names you add</text>

  <!-- option 3: public (crossed out) -->
  <rect x="28" y="176" width="346" height="40" rx="8" fill="#f6f5f1" stroke="#e3e1da"/>
  <circle cx="48" cy="196" r="7" fill="none" stroke="#c9c7c0" stroke-width="1.8"/>
  <text x="64" y="194" class="t" style="fill:#9a988f">Anyone with the link</text>
  <text x="64" y="209" class="s" style="fill:#b0aea7">Public, outside your organization</text>
  <path d="M64 190h132" stroke="#A31F34" stroke-width="1.8"/>

  <!-- labels -->
  <path d="M378 100h28" stroke="#2E6B2A" stroke-width="2"/>
  <rect x="408" y="88" width="196" height="24" rx="5" fill="#2E6B2A"/>
  <text x="506" y="104.5" text-anchor="middle" class="lab">For this course: either one</text>
  <path d="M378 148h28" stroke="#2E6B2A" stroke-width="2"/>
  <path d="M406 148V112" stroke="#2E6B2A" stroke-width="2"/>
  <path d="M378 196h28" stroke="#A31F34" stroke-width="2"/>
  <rect x="408" y="184" width="196" height="24" rx="5" fill="#A31F34"/>
  <text x="506" y="200.5" text-anchor="middle" class="lab">Not for this course</text>
</svg>
