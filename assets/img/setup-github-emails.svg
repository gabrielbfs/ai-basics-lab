<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Illustration: GitHub Settings, Emails page, with the two privacy checkboxes turned on and highlighted">
  <!-- Illustration of GitHub Settings > Emails, drawn for AI Basics Lab. Not a screenshot. Grey bars stand for text that isn't needed here. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;fill:#1f2328}
    .m{fill:#59636e}
  </style>
  <rect width="560" height="250" fill="#ffffff"/>
  <!-- left menu -->
  <text x="16" y="28" class="t m" style="font-size:12px;font-weight:600">Settings</text>
  <text x="24" y="58" class="t">Public profile</text>
  <text x="24" y="86" class="t">Account</text>
  <rect x="12" y="98" width="140" height="28" rx="6" fill="#f6f8fa"/>
  <rect x="12" y="102" width="4" height="20" rx="2" fill="#0969da"/>
  <text x="24" y="117" class="t" style="font-weight:600">Emails</text>
  <text x="24" y="146" class="t">Notifications</text>
  <!-- main -->
  <text x="176" y="34" class="t" style="font-size:20px;font-weight:600">Emails</text>
  <line x1="176" y1="48" x2="544" y2="48" stroke="#d1d9e0"/>
  <rect x="176" y="62" width="200" height="9" rx="4" fill="#e6e9ec"/>
  <rect x="176" y="78" width="300" height="9" rx="4" fill="#eff1f3"/>
  <!-- checkbox 1 -->
  <rect x="186" y="118" width="16" height="16" rx="3" fill="#0969da"/>
  <path d="M190 126l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="212" y="131" class="t" style="font-weight:600">Keep my email addresses private</text>
  <rect x="212" y="141" width="280" height="8" rx="4" fill="#eff1f3"/>
  <!-- checkbox 2 -->
  <rect x="186" y="172" width="16" height="16" rx="3" fill="#0969da"/>
  <path d="M190 180l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="212" y="185" class="t" style="font-weight:600">Block command line pushes that expose my email</text>
  <rect x="212" y="195" width="250" height="8" rx="4" fill="#eff1f3"/>
  <!-- highlight -->
  <rect x="176" y="106" width="372" height="108" rx="8" fill="none" stroke="#A31F34" stroke-width="3"/>
  <rect x="432" y="222" width="112" height="24" rx="5" fill="#A31F34"/>
  <text x="488" y="238.5" text-anchor="middle" style="font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;font-weight:700;fill:#ffffff">Turn both on</text>
</svg>
