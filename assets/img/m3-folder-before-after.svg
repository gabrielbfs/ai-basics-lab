  <text x="66" y="54" class="t" style="font-weight:700">ai-basics</text>
  <g class="t"><text x="40" y="84">project-idea</text><text x="40" y="110">assumptions.xlsx</text><text x="40" y="136">sample-data.xlsx</text></g>

  <path d="M266 100h40M300 94l6 6-6 6" fill="none" stroke="#8a8f98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="330" y="24" class="hd">AFTER EXERCISE B</text>
  <path d="M330 38h16l4 5h22v14H330z" fill="#f2c94c"/>
  <text x="380" y="54" class="t" style="font-weight:700">ai-basics</text>
  <g class="t"><text x="354" y="84">project-idea</text><text x="354" y="110">assumptions.xlsx</text><text x="354" y="136">sample-data.xlsx</text></g>
  <g class="tag" fill="#7a7870"><text x="520" y="110">unchanged</text><text x="520" y="136">unchanged</text></g>
  <rect x="346" y="146" width="280" height="54" rx="7" fill="#e6f4ea"/>
  <g class="t" style="font-weight:700"><text x="354" y="168">inputs.xlsx</text><text x="354" y="192">brief.docx</text></g>
  <g class="tag" fill="#2E6B2A"><text x="520" y="168">NEW</text><text x="520" y="192">NEW</text></g>
