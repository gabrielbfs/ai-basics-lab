<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="The ai-basics folder before and after Exercise B. Before: project-idea, assumptions.xlsx, sample-data.xlsx. After: the same three files, unchanged, plus two new files, inputs.xlsx and brief.docx.">
  <!-- Folder before/after for Module 3 Exercise B, drawn for AI Basics Lab. -->
  <style>
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;fill:#2f2f2c}
    .m{fill:#7a7870}
    .hd{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;letter-spacing:.08em;font-weight:600;fill:#5f6368}
    .tag{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:10.5px;font-weight:700}
  </style>
  <rect width="640" height="210" fill="#ffffff"/>
  <!-- folder icon helper: drawn inline twice -->
  <text x="16" y="24" class="hd">BEFORE</text>
