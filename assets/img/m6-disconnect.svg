<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" role="img" aria-label="Illustration of Customize, Connectors. Google Calendar shows Connected, and its menu button is open with the option Disconnect highlighted. Label: done with the exercise? Disconnect.">
