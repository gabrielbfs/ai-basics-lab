<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Basics Lab</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Bitter:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap");
/* ==========================================================================
   AI Basics Lab: shared styles (one stylesheet for every page)

   Brand: MIT Sloan Brand Guidelines, "Color, Typography, Photography"
   (mitsloan.mit.edu/brand-guidelines/color-typography-photography)

   Official palette used here (web HEX):
     Primary    Sloan Red #A31F34 · Silver Gray #8A8B8C · Dark Gray #545759 · Light Gray #C9C8C7
     Secondary  Navy #041D40 · Blue #00698E · Light Blue #6AA2B8 · Dark Green #006B67
                Blue Green #4D858D · Dark Gray 2 #333D47
     Accent     Orange #ED7700 (the ONE highlight on this site; the guidelines say one per application)
                Not used: Light Orange #F6B221, Light Blue 2 #288DC0, Bright Red #EC0044
   Tints marked "tint" are lighter mixes of a palette color, needed for soft
   backgrounds. Light theme only. Every text/background pair meets WCAG AA (4.5:1).

   Fonts (guidelines): Futura LT Pro = headlines; Adelle = website body copy.
   Both are licensed (Futura via brand.mitsloan@mit.edu). Each stack tries the real
   font first (Futura ships with macOS), then a free look-alike: Jost for Futura,
   Bitter for Adelle, then Arial (the guidelines' standard web font).
   ========================================================================== */

:root{
  --bg:#FFFFFF;
  --surface:#F4F4F3;        /* tint of Light Gray */
  --surface2:#E9E9E8;       /* tint of Light Gray */
  --line:#C9C8C7;           /* Light Gray */
  --fg:#333D47;             /* Dark Gray 2 */
  --muted:#545759;          /* Dark Gray */
  --accent:#A31F34;         /* Sloan Red */
  --accent-strong:#82192A;  /* shade of Sloan Red (hover) */
  --accent-soft:#F6E6E9;    /* tint of Sloan Red */
  --on-accent:#FFFFFF;
  --navy:#041D40;           /* Navy */
  --navy-soft:#E5E9EF;      /* tint of Navy */
  --ok:#006B67;             /* Dark Green */
  --ok-soft:#E0EFEE;        /* tint of Dark Green */
  --hi:#ED7700;             /* Orange: marks, borders, dots (not small text) */
  --hi-ink:#333D47;         /* text that sits on the highlight tint */
  --hi-soft:#FDEBD6;        /* tint of Orange */
  --display:"Futura LT Pro","Futura PT","Futura","Jost",Arial,sans-serif;
  --body:"Adelle","Bitter",Arial,serif;
  --ui:"Futura LT Pro","Futura PT","Futura","Jost",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
a:hover{color:var(--accent-strong)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0;font-weight:700}
p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:4px}
button{font:inherit;color:inherit}
img{max-width:100%;height:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:10;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:6px;font-family:var(--ui)}
.skip:focus{left:16px}

/* ---------- layout: sticky rail + main ---------- */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px;padding-block:28px 80px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px;font-family:var(--ui);max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--fg)}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.overall{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.nav{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.nav a{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:15px;line-height:1.3}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{background:var(--surface2);font-weight:600}
.nav .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* sections of the current module, nested under it in the rail (and in the phone menu) */
.secs{list-style:none;margin:2px 0 8px 22px;padding:0 0 0 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.secs .sg{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.secs a{display:block;padding:4px 8px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:13.5px;line-height:1.3}
.secs a:hover{color:var(--fg);background:var(--surface)}
.secs a[aria-current="location"]{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.otp{display:none}
.navsep{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.dot.prog{border-color:var(--hi);background:linear-gradient(90deg,var(--hi) 50%,transparent 50%)}
.dot.done{border-color:var(--ok);background:var(--ok)}
.railnote{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
main{min-width:0}
main:focus{outline:none}

/* ---------- shared bits ---------- */
.draft{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hi-ink);background:var(--hi-soft);border-left:3px solid var(--hi);padding:3px 8px;border-radius:0 4px 4px 0}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.chip.prog{background:var(--hi-soft);color:var(--hi-ink);box-shadow:inset 3px 0 0 var(--hi)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.track{background:var(--navy-soft);color:var(--navy)}
.chip.setup{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{font-family:var(--ui);border:1px solid var(--line);background:var(--bg);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn:disabled{opacity:.45;cursor:default}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.para{max-width:68ch;margin:0}
.tablewrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
table.cmp th,table.cmp td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.cmp td:first-child{font-weight:600}
table.cmp caption{caption-side:top;text-align:left;font-family:var(--ui);font-weight:600;font-size:15px;color:var(--fg);padding:4px 0 6px}
table.cmp ul.todo{margin:0;padding-left:18px}table.cmp ul.todo li{margin:0 0 6px}table.cmp ul.todo li:last-child{margin-bottom:0}table.cmp.setup td:first-child,table.cmp.setup td:last-child{white-space:nowrap}
.note-box{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px dashed var(--navy);border-radius:10px;font-size:15px}
.note-box b{color:var(--navy)}

/* ---------- overview ---------- */
.hero{display:flex;flex-direction:column;gap:16px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.lede{font-size:18px;color:var(--muted);max-width:62ch}
.sect{margin-top:44px;display:flex;flex-direction:column;gap:14px}
.sect > h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcard{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--fg);background:var(--bg)}
.mcard:hover{border-color:var(--accent);color:var(--fg)}
.mcard .num{font-family:var(--display);font-weight:700;font-size:28px;color:var(--accent);line-height:1}
.mcard b{display:block;font-family:var(--ui);font-size:17px}
.mcard .out{font-size:14.5px;color:var(--muted)}
.mcard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tracks > div{padding:16px;border-left:3px solid var(--navy);background:var(--navy-soft);border-radius:0 8px 8px 0}
.tracks b{color:var(--navy);font-family:var(--ui);font-size:16px}
.tracks p{font-size:14.5px;margin-top:4px}
/* Three ways to learn: three equal boxes in one row (stacked on phones) */
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ways > div{display:flex;flex-direction:column;gap:6px;padding:18px 20px;background:var(--surface);border-radius:10px;border-left:4px solid var(--accent)}
.ways .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ways .when{font-family:var(--display);font-weight:700;font-size:clamp(17px,1.7vw,22px);line-height:1.2;color:var(--accent);white-space:nowrap}
.ways b{font-family:var(--ui);font-size:17px;line-height:1.3;margin-top:4px}
.ways p{margin:0;font-size:14.5px;color:var(--muted)}

/* ---------- module header ---------- */
.mhead{display:flex;flex-direction:column;gap:10px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.mhead .top{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.mhead h1{font-size:clamp(30px,4.4vw,46px);letter-spacing:-.015em}
.mhead .goal{font-size:17.5px;color:var(--muted);max-width:64ch}
.mhead .leave{margin:0;font-size:16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mhead .leave .sub{color:var(--accent)}
.outcomes{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.outcomes span{font-size:13.5px;background:var(--surface);padding:5px 10px;border-radius:6px}
.budget{display:flex;gap:3px;margin-top:6px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.budget span{display:flex;flex-direction:column;gap:5px;min-width:58px;white-space:nowrap}
.budget i{display:block;height:6px;border-radius:2px;background:var(--line)}
.budget span.b-do i{background:var(--accent)}
.budget em{font-style:normal}
.budget b{color:var(--fg);font-weight:500}

/* ---------- module sections ---------- */
.station{margin-top:48px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:20px}
.station > header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.station > header .sn{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500}
.station > header h2{font-size:25px}
.station > header .mins{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.station .intro{color:var(--muted);max-width:66ch}

.before{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:0 12px 12px 0;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.before ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.before .catch{font-size:15px}
.before .ready{gap:0;padding-left:0}
.before .ready label{padding:6px 8px}
.ready .ifnot{display:block;font-size:13.5px;color:var(--accent);margin-top:2px}
.ready input:checked + span .ifnot{display:none}
.ready .files{margin:2px 0 6px 42px}

.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.concept{padding:16px 18px;background:var(--surface);border-radius:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.concept b{font-family:var(--ui);font-size:16px}
.concept p{font-size:15px}
ul.pts{list-style:disc;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
ul.pts li::marker{color:var(--accent)}
.concept ul.pts{font-size:15px}
.keyidea{border-left:3px solid var(--accent);padding:4px 0 4px 16px;font-size:18px;max-width:64ch}

.ex{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ex .exh{padding:10px 16px;font-family:var(--ui);font-weight:600;font-size:15px;background:var(--surface);border-bottom:1px solid var(--line)}
.ex .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.ex .pair > div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ex .pair > div + div{border-left:1px solid var(--line)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.lbl.weak{color:var(--muted)} .lbl.strong{color:var(--ok)}
.ex .q{font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ex .why{padding:10px 16px;font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line)}
details.why{padding:0}
details.why summary{cursor:pointer;padding:10px 16px;font-family:var(--ui);font-weight:600;font-size:14px;color:var(--navy)}
details.why > div{padding:0 16px 12px}
:is(.ex,.prompt) .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
:is(.ex,.prompt) .tag{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--navy-soft);color:var(--navy)}
.ex .exh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ex .exidea{font-family:var(--ui);font-weight:400;font-size:13px;color:var(--muted)}
.ex .exrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex .gets{font-size:14px;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.ex .gets b{color:var(--ink,inherit);font-family:var(--ui);font-weight:600}
/* highlighted parts of a strong prompt; the tag below uses the same color */
mark.hl{color:inherit;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl-0{background:#DCEBFF} :is(.ex,.prompt) .tag.hl-0{color:#1F4E8C;background:#DCEBFF}
.hl-1{background:#DDF2D8} :is(.ex,.prompt) .tag.hl-1{color:#2E6B2A;background:#DDF2D8}
.hl-2{background:#FFEFC2} :is(.ex,.prompt) .tag.hl-2{color:#7A5A00;background:#FFEFC2}
.hl-3{background:#F8DCE6} :is(.ex,.prompt) .tag.hl-3{color:#8C2347;background:#F8DCE6}
.hl-4{background:#E9E1F7} :is(.ex,.prompt) .tag.hl-4{color:#5B3A8C;background:#E9E1F7}
.fw-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.fw-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.fw-card .fw-name{font-family:var(--display);font-size:18px;color:var(--accent)}
.fw-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fw-card li{display:flex;flex-direction:column;font-size:14.5px;line-height:1.35}
.fw-card li b{font-family:var(--ui);font-size:14.5px}
.fw-card .fw-ic{width:15px;height:15px;vertical-align:-2px;margin-right:7px;color:var(--accent)}
.fw-card li span{color:var(--muted)}
.fw-good{margin:auto 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px}
.fw-good span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fw{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.fw-task{margin:0;font-size:15px}
.fw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.fw-item{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:0 10px 10px 0;padding:12px 14px;background:var(--bg);min-width:0}
.fw-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fw-tip{margin-top:4px;flex-direction:column;gap:6px}
.fw-tip ul.pts{gap:8px}
.fw-item b{font-family:var(--ui);font-size:14.5px}
.fw-item .q{font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.idea-groups{padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.idea-intro{grid-column:1/-1;margin:0;font-size:14.5px;color:var(--muted)}
.idea-group{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.idea-group ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.idea-group li::marker{color:var(--accent)}

/* demo (video + click-through) */
.demo{background:var(--surface);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.demo .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.demo .dh b{font-family:var(--ui);font-size:16px}
.video{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-soon{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:14.5px;background:var(--bg)}
.turns{display:flex;flex-direction:column;gap:12px}
.turn{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.bubble{padding:12px 14px;border-radius:10px;font-size:15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bubble .who{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bubble.you{background:var(--bg);border:1px solid var(--line)}
.bubble.claude{background:var(--navy-soft)}
.bubble.claude .who{color:var(--navy)}
.bubble .body{white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* steps */
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
ol.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent);line-height:1.45}
ol.steps li.grp{display:block;counter-increment:none;padding:18px 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--line)}
ol.steps li.grp:first-child{padding-top:0}
ol.steps li.grp::before{content:none}
ol.steps li > div > b{display:block;font-family:var(--ui);font-size:16px}
ol.steps li span b{color:var(--fg);font-weight:600}
ol.steps li span{color:var(--muted);font-size:15px}
ol.steps ul.pts{list-style:disc;margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
ol.steps ul.pts li{display:list-item;counter-increment:none;padding:0;border:0;color:var(--muted);font-size:15px}
ol.steps ul.pts li::before{content:none}
ol.steps ul.pts li::marker{color:var(--accent)}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:0 8px 8px 0;background:var(--hi-soft);border-left:4px solid var(--hi);font-size:15px}
.tip b{color:var(--hi-ink);white-space:nowrap;font-family:var(--ui)}
.transfer{font-size:14.5px;color:var(--muted)}
.transfer b{color:var(--fg);font-family:var(--ui)}

/* exercise */
.task{border:2px solid var(--accent);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.task .th{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.task .th h3{font-size:20px;flex:1 1 240px}
.task .th .mins{font-family:var(--mono);font-size:12px;color:var(--muted)}
.where{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.prompt{position:relative;background:var(--surface);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.6}
.prompt .pl{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 90px 8px 0}
.prompt .ptext{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.prompt .copy{position:absolute;top:8px;right:8px;font-size:13px;padding:4px 10px}
.deliver{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px;margin:0}
.deliver dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.deliver dd{margin:0}
.good{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.good img{display:block;width:100%}
.good figcaption,.good .goodtext{padding:10px 14px;font-size:14.5px;color:var(--muted)}
.good .goodtext{color:var(--fg);white-space:pre-line}
.good img + .goodtext,.good figcaption + .goodtext{border-top:1px solid var(--line)}
.good img{max-width:620px;margin:0 auto}
.files{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.files .sub{margin-right:4px}
.btn.file{text-decoration:none;color:var(--fg);font-size:13.5px;padding:5px 12px}
.btn.file::before{content:"↓ ";color:var(--accent)}
.reveal{border:1px dashed var(--navy);border-radius:10px;background:var(--navy-soft)}
.reveal summary{cursor:pointer;padding:10px 14px;font-family:var(--ui);font-weight:600;font-size:15px;color:var(--navy)}
.reveal[open] summary{border-bottom:1px dashed var(--navy)}
.reveal-body{padding:12px 14px;font-size:15px;white-space:pre-line;max-width:72ch}
.reveal-shot{padding:12px 14px 0}
.reveal-shot .shot{max-width:680px;margin:0}

/* responsible use */
.resp{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:10px;background:var(--accent-soft);border-left:4px solid var(--accent)}
.resp b{font-family:var(--ui);color:var(--accent)}
.resp p{max-width:68ch}
.resp ol{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.resp .resp-note{font-size:14px;color:var(--muted);margin-top:4px}
.resp .usenever{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px;margin:4px 0}
.resp .usenever > div{background:var(--bg);border-radius:8px;padding:10px 14px}
.resp .usenever .sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.resp .use .sub{color:var(--ok)} .resp .never .sub{color:var(--accent)}
.resp .usenever ul.pts{margin-top:6px;font-size:15px}
.resp .use li::marker{color:var(--ok)}
.resp .resp-tip b{margin-right:6px}
.resp.base{margin-top:12px;background:var(--navy-soft);border-left-color:var(--navy)}
.resp.base b{color:var(--navy)}

/* stuck? */
.stuck{display:flex;flex-direction:column;gap:8px}
.stuck details{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.stuck summary{cursor:pointer;padding:12px 16px;font-family:var(--ui);font-weight:600;font-size:15.5px;list-style-position:inside}
.stuck details[open] summary{border-bottom:1px dashed var(--line)}
.stuck .fix{padding:12px 16px;font-size:15px;max-width:72ch}
.stuck-foot{font-size:14px;color:var(--muted)}

/* finish: the "Mark as done" box at the end of each module */
.finish{background:var(--surface);border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
.finish p{margin:0}
.finish ul.did{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.finish ul.did li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:10px}
.finish .donerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:4px}
.finish .donenote{font-size:13.5px;color:var(--muted)}
.btn.is-done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:9px 10px;border-radius:8px;cursor:pointer}
.checks label:hover{background:var(--bg)}
.checks input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--ok)}
.checks input:checked + span{color:var(--muted)}
.checks .ev{display:block;font-size:13.5px;color:var(--muted)}
.quiz{display:flex;flex-direction:column;gap:18px}
.qq{display:flex;flex-direction:column;gap:8px}
.qq .qtext{font-size:15.5px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font-family:var(--body);text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.fb{font-size:14.5px;color:var(--muted)}
.fb.ok{color:var(--ok)}


/* Go deeper: one table of links (Resource | Source | Type) with group divider rows */
table.cmp.restable{min-width:0}
table.cmp.restable td:first-child{font-weight:400}
table.cmp.restable td:not(:first-child){color:var(--muted);font-size:14px;white-space:nowrap}
table.cmp.restable tr.grp th{padding:16px 12px 6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500;border-bottom:1px solid var(--line)}
table.cmp.restable tbody tr.grp:first-child th{padding-top:8px}
@media (max-width:640px){table.cmp.restable td:not(:first-child){white-space:normal}}

/* coming soon */
.soon{margin-top:32px;padding:24px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;max-width:68ch}
.soon b{font-family:var(--ui);font-size:17px}
.soon .chip.coming{align-self:flex-start}
.chip.coming{background:var(--hi-soft);color:var(--hi-ink)}
.mcard.is-soon{opacity:.6}
.mcard.is-soon:hover{opacity:1}
.soontag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#nav a.is-soon > span:nth-child(2){color:var(--muted)}
.previewbar{margin:0 0 16px;padding:8px 12px;border-radius:8px;background:var(--hi-soft);color:var(--hi-ink);border:1px dashed var(--hi);font-family:var(--ui);font-size:14px}

/* pager */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap;font-family:var(--ui)}
.pager a{text-decoration:none;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;color:var(--fg);max-width:48%}
.pager a:hover{border-color:var(--accent);color:var(--fg)}
.pager small{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pager .next{margin-left:auto;text-align:right}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:16px 60px}
  .rail{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav a{grid-template-columns:auto auto auto;white-space:nowrap;border:1px solid var(--line)}
  .navsep,.railnote,.nav .secs{display:none}
  .rail{max-height:none;overflow:visible}
  .otp{display:block;position:sticky;top:0;z-index:5;margin:0 0 8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-family:var(--ui)}
  .otp summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px}
  .otp .secs{margin:0 0 8px 14px;max-height:60vh;overflow-y:auto}
  .turn{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .grid,.concepts,.tracks,.ways,.resp .usenever{grid-template-columns:minmax(0,1fr)}
  .ex .pair{grid-template-columns:minmax(0,1fr)}
  .idea-groups{grid-template-columns:minmax(0,1fr)}
  .ex .pair > div + div{border-left:0;border-top:1px solid var(--line)}
  .pager a{max-width:100%}
  .station > header .mins{margin-left:0;width:100%}
  .budget span{white-space:normal;min-width:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .rail,.otp,.ctrl,.copy,.pager,.skip{display:none!important}
  .shell{display:block}
  .stuck details{break-inside:avoid}
}

/* ---------- exercise steps and breakdown diagrams (Module 4) ---------- */
.xsteps{margin:4px 0 4px;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.xsteps li::marker{color:var(--accent);font-family:var(--ui);font-weight:700}
figure.diagram{margin:18px 0 6px;max-width:760px}
figure.diagram svg,figure.diagram img{display:block;width:100%;height:auto}
figure.diagram figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.dg-frame{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.dg-pane{fill:var(--bg);stroke:var(--line);stroke-width:1}
.dg-art{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.dg-bar{fill:var(--surface2)}
.dg-bubble{fill:var(--surface2)}
.dg-you{fill:var(--navy-soft);stroke:var(--navy);stroke-width:1}
.dg-card{fill:var(--surface);stroke:var(--line);stroke-width:1}
.dg-btn{fill:var(--bg);stroke:var(--line);stroke-width:1}
.dg-t{fill:var(--fg);font-family:var(--ui);font-size:13px}
.dg-s{fill:var(--muted);font-family:var(--ui);font-size:11px}
.dg-h{fill:var(--fg);font-family:var(--ui);font-size:14px;font-weight:700}
.dg-a{fill:var(--accent);font-family:var(--ui);font-size:12px;font-weight:700}
.dg-line{stroke:var(--accent);stroke-width:1.5;fill:none}
.dg-dot{fill:var(--accent)}
.dg-n{fill:var(--on-accent);font-family:var(--ui);font-size:12px;font-weight:700}

/* ---------- screenshots on the overview ---------- */
/* Setup step screenshots: always visible, under the step */
.shot{margin:10px 0 4px;max-width:520px}
.shot-img{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.shot-img img{display:block;width:100%;height:auto}
.shot .hl{position:absolute;border:3px solid var(--accent);border-radius:6px;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.shot .hl em{position:absolute;left:100%;top:50%;transform:translate(8px,-50%);background:var(--accent);color:var(--on-accent);font:600 12px/1.2 var(--ui);font-style:normal;padding:3px 7px;border-radius:4px;white-space:nowrap}
.shot figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.shot-todo{margin:8px 0 4px;max-width:520px;padding:10px 12px;border:1.5px dashed var(--hi);border-radius:8px;background:var(--hi-soft);font-size:13.5px;color:var(--fg)}
.asof{margin:6px 0 0;font-size:13px;color:var(--muted)}

</style>

    sample: {
      title: "See one case in each framework",
      task: "**Made-up example** · Your tool needs a gross-margin assumption. Claude says a typical SaaS gross margin is about 75%, citing a software vendor's blog. Another source you found says about 63%.",
      tryIt: "Each prompt applies one framework to the same case. Copy one into Claude and compare what you get.",
      items: [
        { name: "SIFT",
          prompt: "**Stop:** Don't treat the 75% as settled yet.\n**Investigate:** Who published the source you cited, and what do they sell?\n**Find:** Give me two other sources I can open that report SaaS gross margins.\n**Trace:** For each, link the original study or table, and say which companies and which year it covers." },
        { name: "CRAAP",
          prompt: "Rate the source you cited for the 75% gross margin:\n**Currency:** When was it published or last updated?\n**Relevance:** Does it cover companies like mine (size, stage, region)?\n**Authority:** Who wrote it, and what's their expertise?\n**Accuracy:** Does it show its data or method?\n**Purpose:** Is it informing, or selling something?" },
        { name: "Chart chooser",
          prompt: "**Question:** How does my margin assumption compare with what the sources report?\n**Type:** That's a comparison, so use a bar chart.\n**Ask:** Make a bar chart with one bar per source (75% and 63%) and one for my assumption. Label each bar with its source and year." },
        { name: "Issue tree (MECE)",
          prompt: "Break down \"Why do the sources disagree: 75% vs. 63%?\" into branches with no overlaps and no gaps:\n**Who:** which kinds of companies each source covers\n**When:** which year each figure is from\n**How:** how each source defines gross margin\nOne line per branch, then say which branch explains most of the gap." },
        { name: "Pyramid Principle",
          prompt: "Recommend the gross-margin assumption for my tool.\n**Answer first:** the value to use, in one sentence.\n**Supporting points:** up to 3 reasons, one per source.\n**Detail last:** a table with each source, its year, what it covers, and one caveat." },
        { name: "5 Whys",
          prompt: "The sources disagree: 75% vs. 63%. Ask \"why?\" up to 5 times to find the root cause, one line per answer. Stop when you reach something I can check myself, and tell me how to check it." }
      ]
    }
  },

        text: "**Option 1: filter.** In the Excel file, the filter arrows are already on. In the CSV or Google Sheets, click the header row and turn them on (Excel: **Data → Filter**; Google Sheets: **Data → Create a filter**). Set `category` to *Dining out* and `quarter` to *Q3*. Select the `amount_usd` cells: Excel shows the sum and count in the status bar at the bottom; Google Sheets shows the sum in the bottom-right corner (click it to see the count).\n\n**Option 2: formula.** In an empty cell, type:\n`=SUMIFS(G:G, F:F, \"Dining out\", C:C, \"Q3\")`\nand to count the rows:\n`=COUNTIFS(F:F, \"Dining out\", C:C, \"Q3\")`\n(Column C is `quarter`, F is `category`, G is `amount_usd`.)" },
      promptLabel: "Copy this prompt",

      deliverable: {"text":"Save in your **ai-basics** folder:","points":["Claude's answer and chart","Your Dining out Q3 total and row count","One sentence: did they agree? If not, why not?"]},

/* ==========================================================================
   AI Basics Lab: small shared pieces (no page layout here)
   - AIBW.esc / AIBW.md   text helpers
   - AIBW.demo            click-through walkthrough
   - AIBW.copy            "Copy" button for prompts
   - AIBW.checklist       "I can..." checkboxes
   - AIBW.quiz            scenario questions with feedback
   Each widget takes a container element and plain data, so it works the same
   on the multi-page site and in the single-file version.
   ========================================================================== */
window.AIBW = (function () {
  "use strict";

  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]);

  /* Tiny formatter for content text: **bold**, *italic*, `code`, [text](link).
     Everything else is shown as plain text. */
  function md(s) {
    return String(s == null ? "" : s).split(/(`[^`]+`)/g).map(part => {
      if (/^`[^`]+`$/.test(part)) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      let h = esc(part);
      h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
        const ext = /^(https?:\/\/|mailto:)/i.test(url);
        if (!ext && url.includes(":")) return text;            // block odd schemes
        return '<a href="' + url + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + text +
          (ext ? '<span class="vh"> (opens in a new tab)</span>' : "") + "</a>";
      });
      h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      h = h.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
      return h;
    }).join("");
  }

  /* Click-through demo. turns: [{who:"you"|"claude", text, note}] */
  function demo(root, turns) {
    if (!root || !turns || !turns.length) return;
    let n = 1;
    root.innerHTML =
      '<div class="turns" aria-live="polite"></div>' +
      '<div class="ctrl"><button type="button" class="btn" data-a="prev">Back</button>' +
      '<button type="button" class="btn primary" data-a="next">Next step</button>' +
      '<button type="button" class="btn" data-a="all">Show all</button>' +
      '<span class="count"></span></div>';
    const list = root.querySelector(".turns");
    const count = root.querySelector(".count");
    const btn = a => root.querySelector('[data-a="' + a + '"]');
    const draw = () => {
      list.innerHTML = turns.slice(0, n).map(t => {
        const who = t.who === "claude" ? "claude" : "you";
        return '<div class="turn"><div class="bubble ' + who + '"><span class="who">' +
          (who === "claude" ? "Claude" : "You") + '</span><span class="body">' + esc(t.text) +
          "</span></div>" + (t.note ? '<p class="note">' + md(t.note) + "</p>" : "<span></span>") + "</div>";
      }).join("");
      count.textContent = n + " of " + turns.length;
      btn("prev").disabled = n <= 1;
      btn("next").disabled = btn("all").disabled = n >= turns.length;
    };
    root.addEventListener("click", e => {
      const b = e.target.closest("[data-a]");
      if (!b) return;
      const a = b.dataset.a;
      n = a === "prev" ? Math.max(1, n - 1) : a === "next" ? Math.min(turns.length, n + 1) : turns.length;
      draw();
    });
    draw();
  }

  /* Copy button. Falls back to selecting the text if the clipboard is blocked. */
  function copy(btn, text, selectEl) {
    if (!btn) return;
    const label = btn.textContent;
    const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = label; }, 1800); };
    const fallback = () => {
      if (selectEl) {
        const r = document.createRange();
        r.selectNodeContents(selectEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
      done("Selected. Press Ctrl/Cmd+C");
    };
    btn.addEventListener("click", () => {
      try { navigator.clipboard.writeText(text).then(() => done("Copied"), fallback); }
      catch (e) { fallback(); }
    });
  }

  /* "I can..." checklist. items: [{text, evidence}], state: {k: true}, onChange() */
  function checklist(root, items, state, onChange) {
    if (!root || !items || !items.length) return;
    const uid = "c" + Math.random().toString(36).slice(2, 7);
    root.innerHTML = '<ul class="checks">' + items.map((c, k) =>
      '<li><label for="' + uid + k + '"><input type="checkbox" id="' + uid + k + '" data-k="' + k + '"' +
      (state[k] ? " checked" : "") + "><span>" + md(c.text) +
      (c.evidence ? '<span class="ev">Evidence: ' + md(c.evidence) + "</span>" : "") +
      "</span></label></li>").join("") + "</ul>";
    root.addEventListener("change", e => {
      const i = e.target.closest("input[data-k]");
      if (!i) return;
      state[+i.dataset.k] = i.checked;
      onChange && onChange();
    });
  }

  /* Quiz. items: [{q, options:[], answer:index, explain}], picks: {k: index}, onChange() */
  function quiz(root, items, picks, onChange) {
    if (!root || !items || !items.length) return;
    root.innerHTML = items.map((q, k) =>
      '<div class="qq" data-q="' + k + '"><p class="qtext"><b>' + (k + 1) + ". " + md(q.q) + "</b></p>" +
      '<div class="opts" role="group" aria-label="Answers to question ' + (k + 1) + '">' +
      q.options.map((o, j) => '<button type="button" class="opt" data-j="' + j + '" aria-pressed="false">' + md(o) + "</button>").join("") +
      '</div><p class="fb" aria-live="polite"></p></div>').join("");
    root.querySelectorAll(".qq").forEach(div => {
      const k = +div.dataset.q, q = items[k];
      const paint = () => {
        const pick = picks[k];
        div.querySelectorAll(".opt").forEach(b => {
          const j = +b.dataset.j;
          b.classList.toggle("right", pick === q.answer && j === q.answer);
          b.classList.toggle("wrong", pick === j && j !== q.answer);
          b.setAttribute("aria-pressed", String(pick === j));
        });
        const fb = div.querySelector(".fb");
        if (pick === undefined) { fb.textContent = ""; fb.className = "fb"; }
        else if (pick === q.answer) { fb.innerHTML = "Correct. " + md(q.explain); fb.className = "fb ok"; }
        else { fb.textContent = "Not quite. Try another answer."; fb.className = "fb"; }
      };
      div.addEventListener("click", e => {
        const b = e.target.closest(".opt");
        if (!b) return;
        picks[k] = +b.dataset.j;
        paint();
        onChange && onChange();
      });
      paint();
    });
  }

  return { esc, md, demo, copy, checklist, quiz };
})();

/* ==========================================================================
   AI Basics Lab: page renderer (the one template for every page)

   Text lives in content/course.js (course settings + overview) and
   content/modules/<id>.js (one file per module). This file only decides
   how that text is laid out. Section order follows the revision plan.

   Two modes, same code:
   - multi-page (default): m00-course-overview.html, m01-briefing-claude.html ... each page loads its own content file
   - single file (<body data-mode="single">): everything bundled, pages switch by #hash
   ========================================================================== */
(function () {
  "use strict";
  const C = window.AIB_COURSE;
  const MODS = (window.AIB_MODULES = window.AIB_MODULES || {});
  const W = window.AIBW;
  const { esc, md } = W;
  const body = document.body;
  const SINGLE = body.dataset.mode === "single";
  const LIST = C.modules;

  /* ---------- progress (saved in this browser only) ---------- */
  const KEY = "aibasics.progress.v3";            // v3: "Mark as done" replaced the mastery check
  let S = {};
  try { S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { S = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } };
  const st = id => S[id] || (S[id] = { b: {} });

  // done = the student pressed "Mark as done"; in progress = any "Before you start" box ticked
  function status(m) {
    const s = st(m.id);
    s.state = s.done ? "done" : Object.values(s.b || {}).some(Boolean) ? "prog" : "todo";   // cached so other pages can show it
    return { state: s.state };
  }
  const LABEL = { todo: "Not started", prog: "In progress", done: "Done" };
  const chip = state => "chip" + (state && state !== "todo" ? " " + state : "");
  const cached = id => (S[id] && S[id].state) || "todo";

  /* ---------- links ---------- */
  // Page file names come from course.js (overviewPage, and page: on each module)
  const pageOf = id => id === "overview" ? C.overviewPage : ((LIST.find(m => m.id === id) || {}).page || id + ".html");
  // ?preview in the address shows unpublished modules (published: false in course.js); links keep it while you click around
  const PREVIEW = /[?&]preview\b/.test(location.search);
  const isPub = id => { const e = LIST.find(m => m.id === id); return !e || e.published !== false; };
  const shown = id => PREVIEW || isPub(id);
  const href = id => SINGLE ? "#" + id : pageOf(id) + (PREVIEW ? "?preview" : "");
  const PAGE_ID = { "index.html": "overview" };      // file name -> id, for the one-file version
  PAGE_ID[C.overviewPage] = "overview";
  LIST.forEach(m => { PAGE_ID[m.page] = m.id; PAGE_ID[m.id + ".html"] = m.id; });
  const pad = n => String(n).padStart(2, "0");
  const mins = m => m.budget ? ["read", "demo", "do", "check"].reduce((a, k) => a + (m.budget[k] || 0), 0) : 0;
  const ext = url => /^https?:/i.test(url) ? ' target="_blank" rel="noopener"' : "";

  /* ---------- frame + rail ---------- */
  function frame() {
    body.insertAdjacentHTML("afterbegin",
      '<a class="skip" href="#main">Skip to content</a>' +
      '<div class="shell"><aside class="rail">' +
        '<a class="brand" href="' + href("overview") + '"><span class="eyebrow">' + esc(C.program) + "</span><b>" + esc(C.title) + "</b></a>" +
        '<div class="overall"><span id="overallTxt"></span><div class="bar"><i id="overallBar"></i></div></div>' +
        '<nav aria-label="Course pages"><ul class="nav" id="nav"></ul></nav>' +
        '<div class="railnote" id="railnote"></div>' +
      '</aside><main id="main" tabindex="-1"></main></div>');
    document.querySelector(".skip").addEventListener("click", e => {
      e.preventDefault(); document.getElementById("main").focus();
    });
  }

  /* Sections of the module on screen, grouped for the sidebar (set by moduleView) */
  let SECS = [];
  const GROUP = { before: "Learn", breakdown: "Learn", frameworks: "Learn", examples: "Learn", demo: "Learn",
                  steps: "Do", exercise: "Do", responsible: "Check", stuck: "Check", deeper: "Check", finish: "Check" };
  function secNav(cls) {
    let last = "";
    return '<ul class="' + cls + '">' + SECS.map(s => {
      const g = GROUP[s.id] || "";
      const head = g && g !== last ? '<li class="sg">' + esc(g) + "</li>" : "";
      last = g || last;
      return head + '<li><a href="#s-' + s.id + '" data-sec="s-' + s.id + '">' + esc(s.title) + "</a></li>";
    }).join("") + "</ul>";
  }

  function rail(cur) {
    const nav = document.getElementById("nav");
    nav.innerHTML =
      '<li><a href="' + href("overview") + '"' + (cur === "overview" ? ' aria-current="page"' : "") +
      '><span class="n">00</span><span>Course Overview</span><span></span></a></li>' +
      LIST.map((m, i) => {
        const s = cached(m.id), soon = !isPub(m.id);
        return '<li><a href="' + href(m.id) + '"' + (cur === m.id ? ' aria-current="page"' : "") + (soon ? ' class="is-soon"' : "") +
          '><span class="n">' + pad(i + 1) + "</span><span>" + esc(m.short || m.title) + "</span>" +
          (soon ? '<span class="soontag">Soon</span>' : '<span class="dot ' + (s === "todo" ? "" : s) + '" title="' + LABEL[s] + '"></span>') + "</a>" +
          (cur === m.id && SECS.length ? '<nav aria-label="Sections on this page">' + secNav("secs") + "</nav>" : "") + "</li>";
      }).join("");
    const done = LIST.filter(m => cached(m.id) === "done").length;
    document.getElementById("overallTxt").textContent = done + " of " + LIST.length + " modules done";
    document.getElementById("overallBar").style.width = (done / LIST.length * 100) + "%";
    document.getElementById("railnote").innerHTML =
      "<span>Progress is saved in this browser only.</span>" +
      (C.status ? "<span>" + esc(C.status) + ".</span>" : "");
    markSection();
    const a = nav.querySelector('[aria-current="page"]');
    if (a && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = a.offsetLeft - nav.offsetLeft - 8;
  }

  /* ---------- overview ---------- */
  // A screenshot with optional highlight boxes ({x, y, w, h, label} in % of the image),
  // or a dashed "Screenshot to add" box while only {todo} is set.
  function shotHTML(s) {
    if (!s) return "";
    if (!s.image) return s.todo ? '<div class="shot-todo"><b>Screenshot to add:</b> ' + esc(s.todo) + "</div>" : "";
    if (!s.alt) console.warn("[AI Basics Lab] screenshot is missing alt text:", s.image);
    return '<figure class="shot"><div class="shot-img"><img src="' + esc(s.image) + '" alt="' + esc(s.alt || "") + '" loading="lazy">' +
      (s.highlight || []).map(h => '<span class="hl" aria-hidden="true" style="left:' + h.x + "%;top:" + h.y + "%;width:" + h.w + "%;height:" + h.h + '%">' +
        (h.label ? "<em>" + esc(h.label) + "</em>" : "") + "</span>").join("") + "</div>" +

      '<section class="sect"><h2>The modules</h2><div class="grid">' + LIST.map((m, i) => {

        o.setup.parts.map(p => "<tr><td>" + esc(p.part) + "</td><td>" +
          (Array.isArray(p.what) ? '<ul class="todo">' + p.what.map(w => typeof w === "string" ? "<li>" + md(w) + "</li>"
            : "<li>" + md(w.text) + shotHTML(w.shot) + "</li>").join("") + "</ul>" : md(p.what)) +
          "</td><td>" + esc(p.neededFor) + "</td></tr>").join("") +
        "</tbody></table></div>" +
        (o.setup.screensAsOf ? '<p class="asof">Screenshots as of ' + esc(o.setup.screensAsOf) + ". The apps may look slightly different now.</p>" : "") +
        "</section>" +

      '<section class="sect"><h2>' + esc(o.how.title) + '</h2><ol class="steps">' + o.how.items.map(x =>
        "<li><div><b>" + esc(x.title) + "</b>" +
          (Array.isArray(x.text) ? '<ul class="pts">' + x.text.map(t => "<li>" + md(t) + "</li>").join("") + "</ul>"
                                 : "<span>" + md(x.text) + "</span>") + "</div></li>").join("") + "</ol></section>";
  }

  /* ---------- module sections ---------- */
  // needs: "text" or {text, ifNot, files}; ifNot shows while the box is unticked; files = download buttons
  function beforeHTML(b) {
    return '<div class="before">' +
      (b.needs && b.needs.length ? '<span class="sub">Checklist</span><ul class="checks ready">' + b.needs.map((x, k) => {
        const it = typeof x === "string" ? { text: x } : x;
        return '<li><label><input type="checkbox" data-b="' + k + '"><span>' + md(it.text) +
          (it.ifNot ? '<span class="ifnot">' + md(it.ifNot) + "</span>" : "") + "</span></label>" +
          (it.files && it.files.length ? '<div class="files">' + it.files.map(f =>
            '<a class="btn file" href="' + esc(f.url) + '" download>' + esc(f.label) + "</a>").join("") + "</div>" : "") + "</li>";
      }).join("") + "</ul>" : "") +
      (b.note ? '<p class="catch"><b>' + esc(b.note.title) + "</b> " + md(b.note.text) + "</p>" : "") +
      (b.catchUp ? '<p class="catch"><b>Missed a step?</b> ' + md(b.catchUp.text || "") +
        (b.catchUp.url ? ' <a href="' + esc(b.catchUp.url) + '"' + ext(b.catchUp.url) + ">" + esc(b.catchUp.label || "Get the catch-up kit") + "</a>" : "") + "</p>" : "") +
      "</div>";
  }

  // a table: {head, rows, caption?}
  const table = t => '<div class="tablewrap"><table class="cmp">' +
    (t.caption ? "<caption>" + esc(t.caption) + "</caption>" : "") + "<thead><tr>" +
    t.head.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
    t.rows.map(r => "<tr>" + r.map(c => "<td>" + md(c) + "</td>").join("") + "</tr>").join("") +
    "</tbody></table></div>";

  function breakdownHTML(bd) {
    // compare: one table or a list of them
    const cmp = bd.compare ? [].concat(bd.compare).map(table).join("") : "";
    // figure: {svg} (inline) or {image, alt} (file in assets/img), optional caption; top: true puts it under the key line
    const f = bd.figure;
    const fig = f ? '<figure class="diagram">' + (f.image ? '<img src="' + esc(f.image) + '" alt="' + esc(f.alt || "") + '" loading="lazy">' : f.svg || "") +
      (f.caption ? "<figcaption>" + md(f.caption) + "</figcaption>" : "") + "</figure>" : "";
    return (bd.key ? '<p class="keyidea">' + md(bd.key) + "</p>" : "") + (f && f.top ? fig : "") +
      '<div class="concepts">' + (bd.concepts || []).map(c =>
        // text can be one paragraph or a list of short bullets
        '<div class="concept"><b>' + esc(c.title) + "</b>" + (Array.isArray(c.text)
          ? '<ul class="pts">' + c.text.map(x => "<li>" + md(x) + "</li>").join("") + "</ul>"
          : "<p>" + md(c.text) + "</p>") + "</div>").join("") + "</div>" +
      (f && !f.top ? fig : "") + cmp;
  }

  // Small chart icons for framework cards: parts: [term, meaning, icon] with icon = bar | line | stacked | hist | scatter
  const ICON = {
    bar: '<path d="M3 14V8M8 14V3M13 14V10" stroke-width="3"/>',
    line: '<path d="M2 12l4-5 4 2 4-6" stroke-width="2"/>',
    stacked: '<path d="M4 14V10M8 14V9M12 14V11" stroke-width="3" stroke-opacity=".45"/><path d="M4 10V5M8 9V2M12 11V7" stroke-width="3"/>',
    hist: '<path d="M2.5 14V11M5.5 14V6M8.5 14V3M11.5 14V7M14.5 14V12" stroke-width="2.6"/>',
    scatter: '<g fill="currentColor" stroke="none"><circle cx="3" cy="12" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="8" cy="10.5" r="1.6"/><circle cx="10.5" cy="6" r="1.6"/><circle cx="13" cy="4" r="1.6"/></g>'
  };
  const icon = k => ICON[k] ? '<svg class="fw-ic" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round">' + ICON[k] + "</svg>" : "";

  // frameworks: {intro, cards:[{name, goodFor, parts:[[term, meaning, icon?]]}], table, note, sample:{title, task, items:[{name, prompt}]}}
  function frameworksHTML(f) {
    const s = f.sample;
    return (f.intro ? '<p class="para">' + md(f.intro) + "</p>" : "") +
      (f.cards ? '<div class="fw-cards">' + f.cards.map(c => '<div class="fw-card"><b class="fw-name">' + esc(c.name) + "</b>" +
        "<ul>" + c.parts.map(p => "<li><b>" + icon(p[2]) + esc(p[0]) + "</b><span>" + md(p[1]) + "</span></li>").join("") + "</ul>" +
        (c.goodFor ? '<p class="fw-good"><span>Good for</span> ' + md(c.goodFor) + "</p>" : "") + "</div>").join("") + "</div>" : "") +
      (f.table ? table(f.table) : "") +
      // note: one sentence, or {label, points} for a highlighted tip box with bullets
      (f.note ? (f.note.points
        ? '<div class="tip fw-tip"><b>' + esc(f.note.label || "Tip") + '</b><ul class="pts">' + f.note.points.map(x => "<li>" + md(x) + "</li>").join("") + "</ul></div>"
        : '<p class="para">' + md(f.note) + "</p>") : "") +
      // sample: the same task written in each framework, as cards with a Copy button (copies the text without ** marks)
      (s ? '<details class="reveal"><summary>' + esc(s.title || "See one task in each framework") + '</summary><div class="fw">' +
        (s.task ? '<p class="fw-task">' + md(s.task) + "</p>" : "") +
        (s.tryIt ? '<p class="fw-task">' + md(s.tryIt) + "</p>" : "") +
        '<div class="fw-grid">' + s.items.map((x, k) => '<div class="fw-item"><div class="fw-head"><b>' + esc(x.name) + "</b>" +
          '<button type="button" class="btn copy" data-fwcopy="' + k + '">Copy</button></div>' +
          '<span class="q" id="fwq-' + k + '">' + md(x.prompt) + "</span></div>").join("") + "</div>" +
        "</div></details>" : "");
  }

  // examples: [{title, weak, strong, tags?, why}]; set guess:true to hide each "why" until opened
  // examples: [{title, idea?, weak, strong, gets?: {weak, strong}, tags?, why}]
  // In strong, mark parts as [[Tag::words]] to color those words and show a matching colored tag.
  // Without marks, tags (if any) show as plain grey-blue chips.
  const HL = /\[\[([^:\]]+)::([\s\S]*?)\]\]/g;
  const plainStrong = s => s.replace(HL, "$2");
  // text with [[Tag::words]] marks -> {html with colored marks, matching tag chips}; also used for exercise prompts
  function hlHTML(text, plainTags) {
    const names = [];
    let html = "", last = 0, mt;
    HL.lastIndex = 0;
    while ((mt = HL.exec(text))) {
      if (names.indexOf(mt[1]) < 0) names.push(mt[1]);
      html += esc(text.slice(last, mt.index)) + '<mark class="hl hl-' + (names.indexOf(mt[1]) % 5) + '">' + esc(mt[2]) + "</mark>";
      last = HL.lastIndex;
    }
    html += esc(text.slice(last));
    const tags = names.length
      ? names.map((t, k) => '<span class="tag hl-' + (k % 5) + '">' + esc(t) + "</span>")
      : (plainTags || []).map(t => '<span class="tag">' + esc(t) + "</span>");
    return { html, tags: tags.length ? '<span class="tags">' + tags.join("") + "</span>" : "" };
  }
  const strongHTML = e => hlHTML(e.strong, e.tags);
  // a text field can be a sentence, a list of bullets, or {text, points} (a lead sentence plus bullets)
  function textBlock(v, tag) {
    const ul = a => '<ul class="pts">' + a.map(x => "<li>" + md(x) + "</li>").join("") + "</ul>";
    if (Array.isArray(v)) return ul(v);
    if (v && v.points) return (v.text ? "<" + tag + ">" + md(v.text) + "</" + tag + ">" : "") + ul(v.points);
    return "<" + tag + ">" + md(v) + "</" + tag + ">";
  }
  function examplesHTML(list, intro, guess) {
    return '<p class="intro">' + md(intro || 'Compare each weak and strong version. The strong one usually adds context, specifics, or what "done" looks like.') + "</p>" +
      list.map((e, k) => { const s = strongHTML(e); return '<div class="ex"><div class="exh">' + esc(e.title) +
          (e.idea ? '<span class="exidea">Key idea: ' + md(e.idea) + "</span>" : "") + '</div><div class="pair">' +
        '<div><span class="lbl weak">Weak</span><span class="q">' + esc(e.weak) + "</span>" +
          (e.gets && e.gets.weak ? '<span class="gets"><b>You get:</b> ' + md(e.gets.weak) + "</span>" : "") + "</div>" +
        '<div><span class="exrow"><span class="lbl strong">Strong</span><button type="button" class="btn copy" data-excopy="' + k + '">Copy</button></span>' +
          '<span class="q" id="exq-' + k + '">' + s.html + "</span>" + s.tags +
          (e.gets && e.gets.strong ? '<span class="gets"><b>You get:</b> ' + md(e.gets.strong) + "</span>" : "") +
        "</div></div>" +
        (e.why ? (guess ? '<details class="why"><summary>What changed?</summary><div>' + md(e.why) + "</div></details>"
                        : '<div class="why">' + md(e.why) + "</div>") : "") + "</div>"; }).join("");
  }

  function demoHTML(d) {
    const v = d.video || {};
    const video = v.embed
      ? '<div class="video"><iframe src="' + esc(v.embed) + '" title="' + esc(v.title || d.title) +
        '" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>' +
        (v.note ? '<p class="note">' + md(v.note) + "</p>" : "")
      : (v.planned ? '<div class="video-soon">Screen-recorded demo (2–3 min, captioned) coming before launch. The walkthrough below covers the same steps.</div>' : "");
    return '<div class="demo"><div class="dh"><b>' + esc(d.title) + '</b><span class="chip">' +
      (v.embed ? "Video + text walkthrough" : "Text walkthrough") + "</span></div>" + video +
      (d.turns && d.turns.length ? '<div id="demo-mount"></div>' : "") + "</div>";
  }

  function stepsHTML(m) {
    // a step can be {title, text}, or {group: "Exercise A · ~10 min"} for an unnumbered heading row; numbering continues across groups
    return '<ol class="steps">' + m.steps.map(x => x.group
      ? '<li class="grp">' + esc(x.group) + "</li>"
      : "<li><div><b>" + esc(x.title) + "</b><span>" + md(x.text) + "</span>" + (x.shot ? shotHTML(x.shot) : "") + "</div></li>").join("") + "</ol>" +   // shot: optional illustration under a step
      (m.tip ? '<div class="tip"><b>Tip</b><span>' + md(m.tip) + "</span></div>" : "") +
      // tipShot: an illustration under the tip, same format as setup shots ({image, alt, caption})
      (m.tipShot ? shotHTML(m.tipShot) : "") +
      (m.transfer ? '<p class="transfer"><b>Works elsewhere too.</b> ' + md(m.transfer) + "</p>" : "");
  }

  // What good looks like: text, an image, or both (image first, then the text)
  function goodHTML(g) {
    if (!g) return "";
    if (g.image && !g.alt) console.warn("[AI Basics Lab] 'What good looks like' image is missing alt text:", g.image);
    const img = g.image ? '<img src="' + esc(g.image) + '" alt="' + esc(g.alt || "") + '" loading="lazy">' +
      (g.caption ? "<figcaption>" + md(g.caption) + "</figcaption>" : "") : "";
    const txt = g.text ? '<p class="goodtext">' + md(g.text) + "</p>" : "";
    return img || txt ? '<figure class="good">' + img + txt + "</figure>" : "";
  }

  function exercisesHTML(m) {
    const many = m.exercises.length > 1;
    return m.exercises.map((x, k) =>
      '<div class="task"><div class="th"><h3>' + esc(x.title) + "</h3>" +
        (many && x.minutes ? '<span class="mins">' + x.minutes + " min</span>" : "") +
        (x.where ? '<span class="where">Do it in: ' + esc(x.where) + "</span>" : "") + "</div>" +
        (x.intro ? textBlock(x.intro, "p") : "") +
        (x.ideas ? '<details class="reveal ideas"><summary>' + esc(x.ideas.title || "Need ideas?") + '</summary><div class="idea-groups">' +
          (x.ideas.intro ? '<p class="idea-intro">' + md(x.ideas.intro) + "</p>" : "") +
          x.ideas.groups.map(g => '<div class="idea-group"><span class="sub">' + esc(g.label) + "</span><ul>" +
            g.items.map(t => "<li>" + md(t) + "</li>").join("") + "</ul></div>").join("") + "</div></details>" : "") +
        (x.files && x.files.length ? '<div class="files"><span class="sub">Downloads</span>' + x.files.map(f =>
          '<a class="btn file" href="' + esc(f.url) + '" download>' + esc(f.label) + "</a>").join("") + "</div>" : "") +
        (x.prompt ? '<div class="prompt"><span class="pl">' + esc(x.promptLabel || "Copy this prompt and fill in the brackets") + "</span>" +
          '<button type="button" class="btn copy" data-copy="' + k + '">Copy</button>' +
          (p => '<span class="ptext" id="ptext-' + k + '">' + p.html + "</span>" + p.tags)(hlHTML(x.prompt)) + "</div>" : "") +
        // numbered steps to do after sending the prompt
        (x.steps && x.steps.length ? (x.stepsLabel ? '<span class="sub">' + esc(x.stepsLabel) + "</span>" : "") +
          '<ol class="xsteps">' + x.steps.map(t => "<li>" + md(t) + "</li>").join("") + "</ol>" : "") +
        '<dl class="deliver">' +
          (x.deliverable ? "<dt>Deliverable</dt><dd>" + textBlock(x.deliverable, "span") + "</dd>" : "") +
          (x.stretch ? "<dt>Stretch</dt><dd>" + textBlock(x.stretch, "span") + "</dd>" : "") +
        "</dl>" +
        (x.goodLooksLike ? '<span class="sub">What good looks like</span>' + goodHTML(x.goodLooksLike) : "") +
        (x.help ? '<details class="reveal help"><summary>' + esc(x.help.title || "How to do it") +
          '</summary><div class="reveal-body">' + md(x.help.text) + "</div>" + (x.help.shot ? '<div class="reveal-shot">' + shotHTML(x.help.shot) + "</div>" : "") + "</details>" : "") +
        // help.shot / reveal.shot: an illustration inside the box, under the text ({image, alt, caption})
        (x.reveal ? '<details class="reveal"><summary>' + esc(x.reveal.title || "Check your answer (open it after you've tried)") +
          '</summary>' + (x.reveal.shot ? '<div class="reveal-shot">' + shotHTML(x.reveal.shot) + "</div>" : "") +
          '<div class="reveal-body">' + md(x.reveal.text) + "</div></details>" : "") +
      "</div>").join("");
  }

  // The module's own rules, then the course rules from course.js (rulesBase) unless base: false; base: "only" shows just the course rules
  function respHTML(r) {
    const li = a => a.map(y => "<li>" + md(y) + "</li>").join("");
    const box = (x, cls) => '<div class="resp' + (cls ? " " + cls : "") + '"><b>' + esc(x.title || "The rule for this module") + "</b>" +
      (x.text ? "<p>" + md(x.text) + "</p>" : "") +
      (x.rules && x.rules.length ? "<ol>" + li(x.rules) + "</ol>" : "") +
      (x.points && x.points.length ? '<ul class="pts">' + li(x.points) + "</ul>" : "") +     // points: a bulleted checklist
      // use / never: two columns (Use ✓ and Never paste ✗)
      (x.use || x.never ? '<div class="usenever">' +
        (x.use ? '<div class="use"><span class="sub">✓ Use</span><ul class="pts">' + li(x.use) + "</ul></div>" : "") +
        (x.never ? '<div class="never"><span class="sub">✗ Never paste</span><ul class="pts">' + li(x.never) + "</ul></div>" : "") + "</div>" : "") +
      (x.after ? x.after.map(y => "<p>" + md(y) + "</p>").join("") : "") +
      (x.tip ? '<p class="resp-tip"><b>Tip</b> ' + md(x.tip) + "</p>" : "") +
      (x.note ? '<p class="resp-note">' + md(x.note) + "</p>" : "") + "</div>";
    // base: "only" = show the course rules as this module's own (Module 1); base: false = hide them
    if (r.base === "only") return C.rulesBase ? box(Object.assign({}, C.rulesBase, { title: r.title || C.rulesBase.title, text: r.text })) : "";
    return box(r) + (r.base !== false && C.rulesBase ? box(C.rulesBase, "base") : "");
  }

  function stuckHTML(list) {
    return '<div class="stuck">' + list.map(x =>
      "<details><summary>" + md(x.problem) + '</summary><div class="fix">' + md(x.fix) + "</div></details>").join("") +
      '<p class="stuck-foot">Still stuck? Write down the exact step and what you saw, and bring it to office hours.</p></div>';
  }

  // Go deeper: [{label, url, source?, type?, group?}] -> one table (Resource | Source | Type), with a divider row per group.
  // Without source, a label like "Anthropic: Prompting best practices" is split at the first ": ".
  // The Source / Type columns only appear when at least one link has one.
  function resHTML(list) {
    const rows = list.map(r => {
      const cut = r.source ? -1 : r.label.indexOf(": ");
      return { r, source: r.source || (cut > 0 ? r.label.slice(0, cut) : ""), title: cut > 0 ? r.label.slice(cut + 2) : r.label };
    });
    const hasSrc = rows.some(x => x.source), hasType = rows.some(x => x.r.type);
    const cols = 1 + hasSrc + hasType;
    let last = null;
    const body = rows.map(x => {
      const g = x.r.group || "";
      const head = g && g !== last ? '<tr class="grp"><th colspan="' + cols + '" scope="colgroup">' + esc(g) + "</th></tr>" : "";
      last = g;
      return head + "<tr><td>" + '<a href="' + esc(x.r.url) + '"' + ext(x.r.url) + ">" + esc(x.title) +
        (ext(x.r.url) ? ' ↗<span class="vh"> (opens in a new tab)</span>' : "") + "</a></td>" +
        (hasSrc ? "<td>" + esc(x.source) + "</td>" : "") + (hasType ? "<td>" + esc(x.r.type || "") + "</td>" : "") + "</tr>";
    }).join("");
    return '<div class="tablewrap"><table class="cmp restable"><thead><tr><th scope="col">Resource</th>' +
      (hasSrc ? '<th scope="col">Source</th>' : "") + (hasType ? '<th scope="col">Type</th>' : "") + "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  function moduleView(m) {
    const i = LIST.findIndex(x => x.id === m.id);
    const entry = LIST[i] || {};
    const t = status(m);
    const b = m.budget || {};
    const secs = SECS = [];
    const add = (id, title, html, minsTxt) => { if (html) secs.push({ id, title, html, minsTxt }); };

    if (m.before) add("before", "Before you start", beforeHTML(m.before));
    if (m.breakdown) add("breakdown", "Key ideas", breakdownHTML(m.breakdown),
      b.read ? "Learn · ~" + b.read + " min" : "");
    if (m.frameworks) add("frameworks", m.frameworks.title || "Prompt frameworks", frameworksHTML(m.frameworks));
    if (m.examples && m.examples.length) add("examples", "Examples", examplesHTML(m.examples, m.examplesIntro, m.examplesGuess));
    if (m.demo) add("demo", "Demo", demoHTML(m.demo), b.demo ? "Demo · ~" + b.demo + " min" : "");
    if (m.steps && m.steps.length) add("steps", "Step by step", stepsHTML(m));
    if (m.exercises && m.exercises.length) add("exercise", m.exercises.length > 1 ? "Your exercises" : "Your exercise", exercisesHTML(m), b.do ? "Do · ~" + b.do + " min" : "");
    if (m.responsibleUse) add("responsible", "Responsible use", respHTML(m.responsibleUse), b.check ? "Check · ~" + b.check + " min" : "");
    if (m.stuck && m.stuck.length) add("stuck", "Stuck?", stuckHTML(m.stuck));
    if (m.resources && m.resources.length) add("deeper", "Go deeper", resHTML(m.resources));
    // Last section on every module: recap, then mark as done (drives the sidebar progress, menu dots and card labels)
    add("finish", "Finish", '<div class="finish">' +
      (m.outcomes && m.outcomes.length ? '<span class="sub">You can now</span><ul class="did">' +
        m.outcomes.map(o => "<li>" + esc(o) + "</li>").join("") + "</ul>" : "") +
      '<div class="donerow"><button type="button" class="btn primary" id="doneBtn" aria-pressed="false">Mark as done</button>' +
      '<span class="donenote">Progress is saved in this browser only.</span></div>' +
      "</div>");

    const budget = m.budget ? '<div class="budget" aria-label="Time plan">' + [["Learn", "read"], ["Demo", "demo"], ["Do", "do"], ["Check", "check"]]
      .filter(x => b[x[1]]).map(x => '<span class="b-' + x[1] + '" style="flex:' + b[x[1]] + '"><i></i><em><b>' + x[0] + "</b> " + b[x[1]] + " min</em></span>").join("") + "</div>" : "";

    // No status/module-number/time/level/track line above the title (removed Nov 17, 2026)
    return '<header class="mhead">' +
        "<h1>" + esc(m.title || entry.title) + "</h1>" +
        // Headline structure for every module: "Learn to…" (goal in the module file), then "You leave with" (output in course.js)
        (m.goal ? '<p class="goal">' + md(m.goal) + "</p>" : "") +
        (entry.output ? '<p class="leave"><span class="sub">You leave with</span> ' + esc(entry.output) + "</p>" : "") +
        (m.outcomes && m.outcomes.length ? '<div class="outcomes">' + m.outcomes.map(o => "<span>" + esc(o) + "</span>").join("") + "</div>" : "") +
        budget +
      "</header>" +
      '<details class="otp"><summary>On this page</summary>' + secNav("secs") + "</details>" +
      secs.map((s, k) => '<section class="station" id="s-' + s.id + '" aria-labelledby="h-' + s.id + '"><header><span class="sn">' + pad(k + 1) +
        '</span><h2 id="h-' + s.id + '" tabindex="-1">' + esc(s.title) + "</h2>" + (s.minsTxt ? '<span class="mins">' + esc(s.minsTxt) + "</span>" : "") +
        "</header>" + s.html + "</section>").join("") +
      pager(i);
  }

  // Shown for modules with published: false (unless ?preview), and for modules with no content file yet
  function soonView(entry, i) {
    const first = LIST.find(m => isPub(m.id));
    return '<header class="mhead">' +
        "<h1>" + esc(entry.title || "Page not found") + "</h1>" +
        (entry.blurb ? '<p class="goal">' + esc(entry.blurb) + "</p>" : "") + "</header>" +
      '<div class="soon"><span class="chip coming">Coming soon</span><b>This module is being updated and will be published soon.</b>' +
        "<p>In the meantime, start with " + (first && first.id !== entry.id ? '<a href="' + href(first.id) + '">Module ' + (LIST.indexOf(first) + 1) + ": " + esc(first.title) + "</a>" : "the course overview") +
        " or come to office hours.</p></div>" + pager(i);
  }

  function pager(i) {
    const prev = i > 0 ? LIST[i - 1] : null, next = i >= 0 && i < LIST.length - 1 ? LIST[i + 1] : null;
    return '<nav class="pager" aria-label="Previous and next module">' +
      (prev ? '<a href="' + href(prev.id) + '"><small>Previous</small>' + esc(prev.title) + "</a>"
            : '<a href="' + href("overview") + '"><small>Back</small>Course Overview</a>') +
      (next ? '<a class="next" href="' + href(next.id) + '"><small>Next</small>' + esc(next.title) + "</a>"
            : '<a class="next" href="' + href("overview") + '"><small>' + (i >= 0 ? "Finish" : "Back") + "</small>Course Overview</a>") +
      "</nav>";
  }

  /* ---------- wire up the interactive parts ---------- */
  function mount(m) {
    const s = st(m.id);
    const refresh = () => {
      const t = status(m);
      save();
      const el = document.getElementById("mchip");
      if (el) { el.className = chip(t.state); el.textContent = LABEL[t.state]; }
      const btn = document.getElementById("doneBtn");
      if (btn) {
        btn.setAttribute("aria-pressed", String(!!s.done));
        btn.className = "btn" + (s.done ? " is-done" : " primary");
        btn.textContent = s.done ? "✓ Done (click to undo)" : "Mark as done";
      }
      rail(m.id);
    };
    if (m.demo && m.demo.turns) W.demo(document.getElementById("demo-mount"), m.demo.turns);
    document.querySelectorAll("[data-copy]").forEach(btn => {
      const k = +btn.dataset.copy;
      W.copy(btn, plainStrong(m.exercises[k].prompt), document.getElementById("ptext-" + k));
    });
    document.querySelectorAll("[data-excopy]").forEach(btn => {
      const k = +btn.dataset.excopy;
      W.copy(btn, plainStrong(m.examples[k].strong), document.getElementById("exq-" + k));
    });
    document.querySelectorAll("[data-fwcopy]").forEach(btn => {
      const k = +btn.dataset.fwcopy;
      W.copy(btn, m.frameworks.sample.items[k].prompt.replace(/\*\*/g, ""), document.getElementById("fwq-" + k));
    });
    const doneBtn = document.getElementById("doneBtn");
    if (doneBtn) doneBtn.addEventListener("click", () => { s.done = !s.done; refresh(); });
    s.b = s.b || {};
    document.querySelectorAll("input[data-b]").forEach(i => {
      i.checked = !!s.b[i.dataset.b];
      i.addEventListener("change", () => { s.b[i.dataset.b] = i.checked; refresh(); });
    });
    refresh();
  }

  /* Section links (sidebar and phone menu): jump without changing the page address */
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-sec]");
    if (!a) return;
    const target = document.getElementById(a.dataset.sec);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: "smooth" });
    const h = target.querySelector("h2");
    if (h) h.focus({ preventScroll: true });
    const otp = a.closest("details.otp");
    if (otp) otp.open = false;
  });

  /* Highlight the section being read */
  function markSection() {
    if (!SECS.length) return;
    let cur = SECS[0].id;
    SECS.forEach(s => { const el = document.getElementById("s-" + s.id); if (el && el.getBoundingClientRect().top < 140) cur = s.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = SECS[SECS.length - 1].id;
    document.querySelectorAll("a[data-sec]").forEach(a => {
      if (a.dataset.sec === "s-" + cur) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current");
    });
  }
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; markSection(); });
  }, { passive: true });

  /* ---------- show a page ---------- */
  function show(id) {
    const main = document.getElementById("main");
    if (id === "overview") {
      SECS = [];
      main.innerHTML = overviewView();
      document.title = C.title + " · " + C.program;
      rail("overview");
      return;
    }
    const i = LIST.findIndex(x => x.id === id);
    const m = shown(id) ? MODS[id] : null;
    if (m) {
      main.innerHTML = (isPub(id) ? "" : '<div class="previewbar">Preview · not published. Students see "Coming soon" on this page.</div>') + moduleView(m);
      mount(m);
    }
    else { SECS = []; main.innerHTML = soonView(LIST[i] || { id }, i); rail(id); }
    if (SINGLE) main.querySelectorAll("a[href]").forEach(a => {   // "m01-briefing-claude.html#..." -> "#m1" in the one-file version
      const k = a.getAttribute("href").match(/^([\w-]+\.html)(#.*)?$/);
      if (k && PAGE_ID[k[1]]) a.setAttribute("href", "#" + PAGE_ID[k[1]]);
    });
    document.title = ((m && m.title) || (LIST[i] && LIST[i].title) || "Page not found") + " · " + C.title;
  }

  function loadModule(id, done) {
    if (MODS[id] || !shown(id)) return done();      // unpublished: don't even load the content file
    const s = document.createElement("script");
    s.src = "content/modules/" + id + ".js";
    s.onload = done;
    s.onerror = done;              // no file yet: the page shows "being written"
    document.head.appendChild(s);
  }

  /* ---------- start ---------- */
  frame();
  if (SINGLE) {
    const route = () => {
      const h = (location.hash || "#overview").slice(1);
      show(h === "overview" || MODS[h] || LIST.some(x => x.id === h) ? h : "overview");
      window.scrollTo(0, 0);
    };
    window.addEventListener("hashchange", route);
    route();
  } else if (body.dataset.page === "module") {
    const id = body.dataset.module;
    loadModule(id, () => {
      show(id);
      if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    });
  } else {
    show("overview");
  }
})();

</script>
</body>
</html>
